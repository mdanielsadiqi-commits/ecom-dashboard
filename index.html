<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="theme-color" content="#08080a"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<title>Ecom Dashboard</title>
<style>
:root{
  --hue:8;              /* heat: 8 = kalt/rot ... 145 = gruen */
  --glow:0.15;          /* glow intensity 0..0.65 */
  --acc:hsl(var(--hue) 85% 55%);
  --acc-soft:hsl(var(--hue) 85% 55% / 0.14);
  --bg0:#08080a; --bg1:#101014; --bg2:#16161c;
  --line:#1e1e26; --line2:#2a2a34;
  --tx:#ececf1; --dim:#8a8a96; --faint:#4a4a55;
  --mo:#5aa4ff; --nawid:#ffb454; --ok:#3ddc97; --warn:#ffb454; --bad:#ff5470;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg0);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;min-height:100vh;overscroll-behavior-y:contain}
button{cursor:pointer;font-family:inherit;border:none;outline:none;color:inherit;background:none}
input,textarea,select{font-family:inherit;outline:none;color:var(--tx)}
::placeholder{color:var(--faint)}

/* Heat glow bleeding from the top */
.heatveil{position:fixed;top:0;left:0;right:0;height:180px;pointer-events:none;z-index:0;
  background:radial-gradient(120% 100% at 50% -40%, hsl(var(--hue) 90% 50% / var(--glow)), transparent 70%);
  transition:background 1.2s ease}
.wrap{position:relative;z-index:1}

.nav{background:rgba(10,10,12,0.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;
  display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:99}
.nbtn{font-size:12px;padding:7px 14px;border-radius:20px;color:var(--dim);background:var(--bg2);border:1px solid var(--line2)}
.nbtn:active{transform:scale(0.96)}
.title{font-size:16px;font-weight:800;letter-spacing:0.2px}
.eyebrow{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--faint);margin-bottom:10px;font-weight:600}

.page{padding:14px 16px calc(env(safe-area-inset-bottom) + 90px);display:flex;flex-direction:column;gap:12px}
.card{background:var(--bg1);border:1px solid var(--line);border-radius:18px;padding:16px;position:relative}
.card.hot{border-color:hsl(var(--hue) 60% 40% / 0.5);box-shadow:0 0 24px hsl(var(--hue) 90% 50% / calc(var(--glow) * 0.6))}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.bbg{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.bb{height:100%;border-radius:2px;transition:width .5s cubic-bezier(.2,.8,.2,1)}

/* Heat header */
.heatbar{display:flex;align-items:center;gap:14px;padding:14px 16px 4px}
.ring{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;position:relative;flex-shrink:0}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring .pc{font-size:14px;font-weight:800}
.heatlabel{flex:1}
.heatlabel .big{font-size:15px;font-weight:800}
.heatlabel .sub{font-size:11px;color:var(--dim);margin-top:2px}
.streakpill{font-size:11px;font-weight:700;padding:5px 10px;border-radius:14px;background:var(--acc-soft);color:var(--acc);border:1px solid hsl(var(--hue) 70% 45% / 0.35);white-space:nowrap}

/* Day pills */
.days{display:flex;gap:5px;padding:10px 16px 0}
.day-btn{flex:1;padding:9px 2px;border-radius:12px;font-size:11px;background:var(--bg2);color:var(--faint);border:1px solid var(--line);text-align:center;font-weight:600;transition:all .2s}
.day-btn.active{background:var(--acc-soft);color:var(--acc);border-color:hsl(var(--hue) 70% 50% / 0.5)}
.day-btn.today:not(.active){border-color:var(--line2);color:var(--dim)}
.day-btn .dot{display:block;width:4px;height:4px;border-radius:50%;margin:3px auto 0;background:transparent}
.day-btn.perfect .dot{background:var(--ok)}

/* Task tiles (swipeable) */
.tile{background:var(--bg0);border-radius:14px;padding:11px 12px;border-left:3px solid;position:relative;overflow:hidden;touch-action:pan-y}
.tile .inner{position:relative;transition:transform .18s ease;display:flex;align-items:center;justify-content:space-between;gap:8px}
.tile .uname{font-size:11px;font-weight:800}
.tile .chk{width:26px;height:26px;border-radius:8px;border:2px solid var(--line2);display:grid;place-items:center;font-size:13px;font-weight:800;color:#000;transition:all .2s;flex-shrink:0}
.tile.done{opacity:.72}
.tile .swipehint{position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:16px;opacity:0;transition:opacity .15s}
.tile.swiping .swipehint{opacity:.8}

.bc{width:42px;height:42px;border-radius:14px;background:var(--bg2);border:1px solid var(--line2);color:var(--tx);font-size:20px;flex-shrink:0;-webkit-user-select:none;user-select:none;display:grid;place-items:center}
.bc:active{transform:scale(0.94)}
.bonus-badge{background:hsl(38 100% 60% / .15);color:var(--warn);font-size:10px;padding:2px 8px;border-radius:20px;font-weight:700}

.tab{padding:8px 15px;border-radius:20px;font-size:12px;color:var(--faint);border:1px solid var(--line);font-weight:600}
.tab.active{background:var(--acc-soft);color:var(--acc);border-color:hsl(var(--hue) 70% 50% / 0.5)}

.note-area{width:100%;background:var(--bg0);border:1px solid var(--line2);border-radius:12px;padding:11px;font-size:13px;line-height:1.6;resize:none;min-height:76px;background-clip:padding-box}
.checklist-input{background:var(--bg0);border:1px solid var(--line2);border-radius:10px;padding:9px 11px;font-size:13px;flex:1}
.amt-input{width:90px;background:var(--bg0);border:1px solid var(--line2);border-radius:9px;padding:7px 9px;font-size:14px;font-weight:700;text-align:right}
.txt-input{background:var(--bg0);border:1px solid var(--line2);border-radius:9px;padding:8px 10px;font-size:13px;width:100%}

.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block;margin-right:5px;vertical-align:1px}
.sync-dot.syncing{background:var(--warn);animation:pulse 1s infinite}
.sync-dot.error{background:var(--bad)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* Partner banner */
.pbanner{border-radius:14px;padding:11px 13px;font-size:12.5px;line-height:1.5;background:hsl(38 90% 55% / .09);border:1px solid hsl(38 90% 55% / .25);color:#ffd9a0}
.pbanner b{color:var(--warn)}

/* Briefing */
.brief{border:1px solid hsl(var(--hue) 60% 45% / .35);background:linear-gradient(160deg, hsl(var(--hue) 80% 50% / .08), transparent 60%), var(--bg1)}

/* Stamp card */
.stamps{display:flex;gap:7px;margin-top:10px}
.stamp{width:38px;height:38px;border-radius:50%;border:1.5px dashed var(--line2);display:grid;place-items:center;font-size:18px;transition:all .3s}
.stamp.got{border:1.5px solid var(--ok);background:hsl(155 60% 45% / .12);animation:stampin .4s cubic-bezier(.2,1.6,.4,1)}
@keyframes stampin{0%{transform:scale(0) rotate(-30deg)}100%{transform:scale(1) rotate(0)}}
.rewardbtn{width:100%;margin-top:12px;padding:12px;border-radius:14px;font-size:13px;font-weight:800;background:linear-gradient(135deg,hsl(150 70% 45%),hsl(160 70% 38%));color:#04120b}
.rewardbtn:disabled{background:var(--bg2);color:var(--faint);font-weight:600}

/* Goats!!! */
.goatzone{position:fixed;inset:0;pointer-events:none;z-index:999;overflow:hidden}
.goat{position:absolute;bottom:-60px;font-size:44px;animation:goatjump 2.6s ease-in forwards}
@keyframes goatjump{
  0%{transform:translate(0,0) rotate(0deg)}
  20%{transform:translate(15vw,-45vh) rotate(-14deg)}
  40%{transform:translate(32vw,-15vh) rotate(10deg)}
  60%{transform:translate(52vw,-55vh) rotate(-10deg)}
  80%{transform:translate(72vw,-20vh) rotate(12deg)}
  100%{transform:translate(95vw,-70vh) rotate(0deg);opacity:0}
}
.perfectflash{position:fixed;inset:0;pointer-events:none;z-index:998;background:radial-gradient(circle at 50% 60%, hsl(150 90% 50% / .22), transparent 60%);animation:pflash 1.6s ease-out forwards}
@keyframes pflash{0%{opacity:0}25%{opacity:1}100%{opacity:0}}

/* Insights */
.spark{display:flex;align-items:flex-end;gap:4px;height:56px}
.spark .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px}
.spark .bar{width:100%;border-radius:4px 4px 0 0;min-height:3px;transition:height .5s}
.spark .lbl{font-size:9px;color:var(--faint)}

.trend-up{color:var(--ok)} .trend-down{color:var(--bad)}

/* Settings */
.setrow{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.setrow:last-child{border-bottom:none}
.colordot{width:22px;height:22px;border-radius:50%;flex-shrink:0;border:2px solid transparent}
.colordot.sel{border-color:#fff}
.smallbtn{font-size:11px;padding:6px 11px;border-radius:10px;background:var(--bg2);border:1px solid var(--line2);color:var(--dim);font-weight:600}
.dangerbtn{color:var(--bad);border-color:hsl(348 100% 60% / .3)}

.fadeup{animation:fadeup .35s ease both}
@keyframes fadeup{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="heatveil"></div>
<div class="wrap"><div id="app" style="padding:40px 20px;text-align:center;color:var(--dim);font-size:13px">Verbinde…</div></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script>
var firebaseConfig = {
  apiKey: "AIzaSyBT1SPluJxSwXBSJB3_XyLZgfNgWKZgyIw",
  authDomain: "ecommonaglobal.firebaseapp.com",
  projectId: "ecommonaglobal",
  storageBucket: "ecommonaglobal.firebasestorage.app",
  messagingSenderId: "945353153605",
  appId: "1:945353153605:web:df7119e7514cdc6c7a172c"
};
firebase.initializeApp(firebaseConfig);
var db = firebase.firestore();
try { db.enablePersistence({synchronizeTabs:true}).catch(function(){}); } catch(e){}

// ---------- Constants ----------
var USERS = ["MO","Nawid"];
var UCOL = {MO:"#5aa4ff", Nawid:"#ffb454"};
var DAYS = ["Mo","Di","Mi","Do","Fr","Sa","So"];
var DNAMES = ["Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag","Sonntag"];
var MONTHNAMES = ["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];
var PALETTE = ["#5aa4ff","#ffb454","#3ddc97","#e879f9","#ff5470","#94a3b8","#f8d477","#7dd3fc"];

var DEFAULT_TASKS = [
  {id:"work", label:"Arbeitsplatz Check-in", sub:"8 Uhr morgens", color:"#5aa4ff"},
  {id:"tt1", label:"Product Research TikTok", sub:"Session 1 – 30 Min", color:"#e879f9"},
  {id:"tt2", label:"Product Research TikTok", sub:"Session 2 – 30 Min", color:"#e879f9"},
  {id:"ig1", label:"Product Research Instagram", sub:"Session 1 – 30 Min", color:"#ff5470"},
  {id:"ig2", label:"Product Research Instagram", sub:"Session 2 – 30 Min", color:"#ff5470"},
  {id:"vid", label:"Videos schneiden", sub:"3 Videos Ziel", color:"#3ddc97", hasCount:true, goal:3},
  {id:"sleep", label:"Sleep 23 Uhr", sub:"Spätestens 23:00", color:"#94a3b8"}
];
var DEFAULT_BIZ = [
  {id:"pferd", name:"Pferdelicht", color:"#ffb454"},
  {id:"drache", name:"Drachenlampe", color:"#ff5470"},
  {id:"drop", name:"Dropshipping", color:"#5aa4ff"},
  {id:"auto", name:"Autohandel", color:"#3ddc97"}
];

// ---------- State ----------
var view = "day";           // day | overview | settings
var cDay = 0;
var cTab = "week";          // week | month | insights
var W = "";
var DATA = {chk:{}, money:{}, notes:{}, checklist:{}, absence:{}};
var CONFIG = {tasks: DEFAULT_TASKS.slice(), businesses: DEFAULT_BIZ.slice()};
var STAMPS = null;          // loaded from firestore
var cMonthDate = new Date(new Date().getFullYear(), new Date().getMonth(), 1);
var MONTH_DATA = {key:null, weeks:{}, loading:false, loaded:false};
var INSIGHTS = {loaded:false, loading:false, weeks:[]};
var briefDismissed = {};

// ---------- Helpers ----------
function activeTasks(){ return CONFIG.tasks.filter(function(t){return !t.paused;}); }
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;"); }
function vib(ms){ if(navigator.vibrate) try{navigator.vibrate(ms||12);}catch(e){} }
function todayIdx(){ var map={1:0,2:1,3:2,4:3,5:4,6:5,0:6}; return map[new Date().getDay()]; }
function dateForDay(dayIdx, weekKey){
  var monday = mondayFromWeekKey(weekKey || W);
  return new Date(monday.getFullYear(), monday.getMonth(), monday.getDate()+dayIdx);
}
function iso(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }

function getWeekKey(){ return weekKeyForDate(new Date()); }
function weekKeyForDate(date){
  var dy=date.getDay(); var di=date.getDate()-dy+(dy===0?-6:1);
  var m=new Date(date.getFullYear(),date.getMonth(),di);
  return m.getFullYear()+"_"+m.getMonth()+"_"+m.getDate();
}
function mondayFromWeekKey(wk){ var p=wk.split("_"); return new Date(+p[0],+p[1],+p[2]); }
function monthKeyFor(d){ return d.getFullYear()+"_"+d.getMonth(); }
function emptyWeekData(){ return {chk:{},money:{},notes:{},checklist:{},absence:{}}; }

// Money: legacy number OR {bizId: amount}
function moneyTotalOf(moneyObj, day){
  var m = moneyObj["d"+day];
  if (typeof m === "number") return m;
  if (!m) return 0;
  var t=0; for (var k in m) t += (+m[k]||0);
  return t;
}
function dayMoneyTotal(day){ return moneyTotalOf(DATA.money, day); }
function bizAmount(day, bizId){
  var m = DATA.money["d"+day];
  if (typeof m === "number") return bizId==="__legacy" ? m : 0;
  return (m && +m[bizId]) || 0;
}
function setBizAmount(day, bizId, amt){
  var m = DATA.money["d"+day];
  if (typeof m === "number") m = {__legacy:m};
  m = m || {};
  amt = Math.max(0, +amt || 0);
  if (amt === 0) delete m[bizId]; else m[bizId] = amt;
  DATA.money["d"+day] = m;
  saveData();
}

// ---------- Firebase ----------
var syncTimer=null;
function loadAll(){
  W = getWeekKey();
  db.collection("weeks").doc(W).onSnapshot(function(snap){
    if (snap.exists){
      var d=snap.data();
      DATA.chk=d.chk||{}; DATA.money=d.money||{}; DATA.notes=d.notes||{};
      DATA.checklist=d.checklist||{}; DATA.absence=d.absence||{};
    }
    render();
  }, function(){ setSyncError(); render(); });

  db.collection("config").doc("app").onSnapshot(function(snap){
    if (snap.exists){
      var d=snap.data();
      if (d.tasks && d.tasks.length) CONFIG.tasks = d.tasks;
      if (d.businesses && d.businesses.length) CONFIG.businesses = d.businesses;
    }
    render();
  });

  db.collection("config").doc("stamps").onSnapshot(function(snap){
    STAMPS = snap.exists ? snap.data() : {};
    USERS.forEach(function(u){ if(!STAMPS[u]) STAMPS[u]={count:0,collected:{},streak:0,best:0,lastPerfect:""}; });
    if (!STAMPS.rewards) STAMPS.rewards=[];
    render();
  });
}
function saveData(){
  setSyncing(true);
  clearTimeout(syncTimer);
  syncTimer=setTimeout(function(){
    db.collection("weeks").doc(W).set(DATA,{merge:true})
      .then(function(){setSyncing(false);}).catch(setSyncError);
  },600);
}
function saveConfig(){
  setSyncing(true);
  db.collection("config").doc("app").set({tasks:CONFIG.tasks, businesses:CONFIG.businesses})
    .then(function(){setSyncing(false);}).catch(setSyncError);
}
function saveStamps(){
  if(!STAMPS) return;
  db.collection("config").doc("stamps").set(STAMPS).catch(setSyncError);
}
function setSyncing(v){ var d=document.getElementById("syncdot"); if(d) d.className="sync-dot"+(v?" syncing":""); }
function setSyncError(){ var d=document.getElementById("syncdot"); if(d) d.className="sync-dot error"; }

// ---------- Stats ----------
function userDayDoneIn(chk, day, user){
  var tasks = activeTasks(), done=0;
  for (var i=0;i<tasks.length;i++){
    var t=tasks[i];
    if (t.hasCount){ if ((chk[day+"_"+user+"_"+t.id+"_v"]||0) >= (t.goal||1)) done++; }
    else if (chk[day+"_"+user+"_"+t.id]) done++;
  }
  return {done:done, total:tasks.length};
}
function userDayDone(day,user){ return userDayDoneIn(DATA.chk, day, user); }
function weekTotal(){ var t=0; for(var i=0;i<7;i++) t+=dayMoneyTotal(i); return t; }
function heatToday(){
  var td=todayIdx(), sum=0;
  for (var i=0;i<USERS.length;i++){
    var r=userDayDone(td,USERS[i]);
    sum += r.total>0 ? r.done/r.total : 0;
  }
  return sum/USERS.length;
}
function applyHeat(){
  var h=heatToday();
  document.documentElement.style.setProperty("--hue", String(Math.round(8+137*h)));
  document.documentElement.style.setProperty("--glow", String((0.12+0.5*h).toFixed(2)));
}

// ---------- Perfect day / Stamps / Goats ----------
function checkPerfect(day, user){
  if (!STAMPS) return;
  var r = userDayDone(day, user);
  if (r.total===0 || r.done < r.total) return;
  var key = W+"_"+day;
  var S = STAMPS[user];
  if (S.collected[key]) return;
  S.collected[key]=true;
  S.count=(S.count||0)+1;
  var d = dateForDay(day);
  var dISO = iso(d);
  var y = new Date(d); y.setDate(y.getDate()-1);
  if (S.lastPerfect === iso(y)) S.streak=(S.streak||0)+1; else if (S.lastPerfect !== dISO) S.streak=1;
  S.lastPerfect = dISO;
  S.best = Math.max(S.best||0, S.streak);
  saveStamps();
  goats(user);
}
function goats(user){
  vib([30,40,30]);
  var flash=document.createElement("div"); flash.className="perfectflash";
  document.body.appendChild(flash);
  var zone=document.createElement("div"); zone.className="goatzone";
  for (var i=0;i<5;i++){
    var g=document.createElement("span"); g.className="goat"; g.textContent="🐐";
    g.style.left=(Math.random()*20-10)+"vw";
    g.style.animationDelay=(i*0.28)+"s";
    zone.appendChild(g);
  }
  document.body.appendChild(zone);
  setTimeout(function(){ zone.remove(); flash.remove(); }, 4500);
}
window.redeemReward = function(user){
  if(!STAMPS || (STAMPS[user].count||0) < 7) return;
  if(!confirm(user+": 7 Stempel einlösen? Gönn dir was! 🐐")) return;
  STAMPS[user].count -= 7;
  STAMPS.rewards.push({user:user, date:iso(new Date())});
  saveStamps(); vib(40);
};

// ---------- Actions ----------
window.toggleTask = function(day,user,taskId){
  var k=day+"_"+user+"_"+taskId;
  DATA.chk[k]=!DATA.chk[k];
  vib();
  saveData();
  if (DATA.chk[k]) checkPerfect(day,user);
  render();
};
window.setCount = function(day,user,taskId,val){
  var k=day+"_"+user+"_"+taskId+"_v";
  DATA.chk[k]=Math.max(0,val);
  vib(8);
  saveData();
  checkPerfect(day,user);
  var el=document.getElementById("cnt_"+day+"_"+user+"_"+taskId);
  if(el) el.innerHTML=countHTML(day,user,taskId);
  applyHeat(); refreshRing();
};
window.onBizInput = function(day,bizId,el){ setBizAmount(day,bizId,el.value); refreshMoneyTotals(day); };
window.saveSharedNote = function(day,val){ DATA.notes["shared_"+day]=val; saveData(); };
window.saveAbsence = function(day,user,val){ DATA.absence[day+"_"+user]=val; saveData(); };

function getCL(day){ return DATA.checklist["d"+day]||[]; }
window.addCLItem = function(day){
  var input=document.getElementById("cl_input_"+day); if(!input) return;
  var val=input.value.trim(); if(!val) return;
  var list=getCL(day); list.push({text:val,done:false});
  DATA.checklist["d"+day]=list; saveData(); input.value="";
  var el=document.getElementById("cl_list_"+day); if(el) el.innerHTML=clHTML(day);
};
window.toggleCL = function(day,idx){
  var list=getCL(day); if(list[idx]) list[idx].done=!list[idx].done;
  DATA.checklist["d"+day]=list; saveData(); vib(6);
  var el=document.getElementById("cl_list_"+day); if(el) el.innerHTML=clHTML(day);
};

window.goDay = function(d){ view="day"; if(d!==undefined)cDay=d; render(); window.scrollTo(0,0); };
window.goOverview = function(tab){
  view="overview"; cTab=tab||"week";
  if(cTab==="month"){ loadMonthData(cMonthDate); }
  else if(cTab==="insights"){ loadInsights(); }
  else render();
  window.scrollTo(0,0);
};
window.goSettings = function(){ view="settings"; render(); window.scrollTo(0,0); };
window.shiftMonth = function(delta){
  cMonthDate=new Date(cMonthDate.getFullYear(),cMonthDate.getMonth()+delta,1);
  loadMonthData(cMonthDate);
};
window.dismissBrief = function(kind){ briefDismissed[kind+"_"+iso(new Date())]=true; render(); };

window.resetDay = function(day){
  if(!confirm(DNAMES[day]+" wirklich zurücksetzen? Aufgaben, Einnahmen, Notizen und Checkliste dieses Tages werden gelöscht.")) return;
  var prefix=day+"_", newChk={};

// ---------- Month data ----------
async function loadMonthData(monthDate){
  var mk=monthKeyFor(monthDate);
  if(MONTH_DATA.key===mk && MONTH_DATA.loaded){ render(); return; }
  MONTH_DATA.key=mk; MONTH_DATA.loading=true; MONTH_DATA.loaded=false; render();
  var year=monthDate.getFullYear(), month=monthDate.getMonth();
  var firstDay=new Date(year,month,1), lastDay=new Date(year,month+1,0);
  var weekKeys={}, dt=new Date(firstDay);
  while(dt<=lastDay){ weekKeys[weekKeyForDate(dt)]=true; dt.setDate(dt.getDate()+1); }
  var keys=Object.keys(weekKeys), results={};
  await Promise.all(keys.map(function(k){
    if(k===W){ results[k]=DATA; return Promise.resolve(); }
    return db.collection("weeks").doc(k).get().then(function(s){ results[k]=s.exists?s.data():emptyWeekData(); })
      .catch(function(){ results[k]=emptyWeekData(); });
  }));
  if(MONTH_DATA.key!==mk) return;
  MONTH_DATA.weeks=results; MONTH_DATA.loading=false; MONTH_DATA.loaded=true;
  render();
}
function weekSummaryInMonth(wk, monthDate){
  var monday=mondayFromWeekKey(wk);
  var wdata=MONTH_DATA.weeks[wk]||emptyWeekData();
  var chk=wdata.chk||{}, money=wdata.money||{};
  var sum={money:0,users:{},dateStart:null,dateEnd:null,days:0};
  USERS.forEach(function(u){sum.users[u]={done:0,total:0};});
  for(var i=0;i<7;i++){
    var d=new Date(monday.getFullYear(),monday.getMonth(),monday.getDate()+i);
    if(d.getMonth()!==monthDate.getMonth()||d.getFullYear()!==monthDate.getFullYear()) continue;
    sum.days++;
    if(!sum.dateStart)sum.dateStart=d;
    sum.dateEnd=d;
    sum.money+=moneyTotalOf(money,i);
    USERS.forEach(function(u){
      var r=userDayDoneIn(chk,i,u);
      sum.users[u].done+=r.done; sum.users[u].total+=r.total;
    });
  }
  return sum;
}

// ---------- Insights ----------
async function loadInsights(){
  if(INSIGHTS.loaded){ render(); return; }
  INSIGHTS.loading=true; render();
  var keys=[], base=mondayFromWeekKey(W);
  for(var i=7;i>=0;i--){
    var d=new Date(base.getFullYear(),base.getMonth(),base.getDate()-7*i);
    keys.push(weekKeyForDate(d));
  }
  var out=[];
  await Promise.all(keys.map(function(k,idx){
    if(k===W){ out[idx]={key:k,data:DATA}; return Promise.resolve(); }
    return db.collection("weeks").doc(k).get().then(function(s){ out[idx]={key:k,data:s.exists?s.data():emptyWeekData()}; })
      .catch(function(){ out[idx]={key:k,data:emptyWeekData()}; });
  }));
  INSIGHTS.weeks=out; INSIGHTS.loading=false; INSIGHTS.loaded=true;
  render();
}

    h+="<div style='font-size:9px;color:"+(mv>0?"var(--ok)":"var(--line2)")+"'>"+(mv>0?(mv>=1000?Math.round(mv/1000)+"k":mv):"")+"</div>";
    h+="<div class='bar' style='background:"+(mv>0?"var(--ok)":"var(--line)")+";height:"+Math.max(6,pc*0.5)+"%'></div>";
    h+="<div class='lbl' style='color:"+(i2===todayIdx()?"var(--acc)":"var(--faint)")+"'>"+DAYS[i2]+"</div>";
    h+="</div>";
  }
  h+="</div></div>";

  // Head to head
  var scores={};
  USERS.forEach(function(u){var td=0,ta=0;for(var di=0;di<7;di++){var r=userDayDone(di,u);td+=r.done;ta+=r.total;}scores[u]={done:td,total:ta};});
  var lead = scores[USERS[0]].done===scores[USERS[1]].done ? null : (scores[USERS[0]].done>scores[USERS[1]].done?USERS[0]:USERS[1]);
  h+="<div class='card' style='text-align:center;padding:12px'>";
  h+="<div style='font-size:12px;color:var(--dim)'>"+(lead?("Führung diese Woche: <b style='color:"+UCOL[lead]+"'>"+lead+"</b> (+"+Math.abs(scores[USERS[0]].done-scores[USERS[1]].done)+" Aufgaben)"):"Gleichstand diese Woche – Kopf an Kopf 🤝")+"</div>";
  h+="</div>";

  h+="<div class='grid2'>";
  USERS.forEach(function(u){
    var s=scores[u], pct=s.total>0?Math.round((s.done/s.total)*100):0;
    h+="<div class='card' style='border-top:3px solid "+UCOL[u]+";text-align:center'>";
    h+="<div style='font-size:13px;font-weight:800;color:"+UCOL[u]+";margin-bottom:6px'>"+u+"</div>";
    h+="<div style='font-size:30px;font-weight:800;color:"+UCOL[u]+"'>"+pct+"%</div>";
    h+="<div style='font-size:11px;color:var(--faint);margin-top:2px'>"+s.done+"/"+s.total+" Aufgaben</div>";
    h+="<div class='bbg' style='margin-top:8px'><div class='bb' style='background:"+UCOL[u]+";width:"+pct+"%'></div></div>";
    h+="</div>";
  });
  h+="</div>";

  h+="<div class='eyebrow' style='margin:4px 0 0'>Tag für Tag</div>";
  for(var di=0;di<7;di++){
    var isTd=di===todayIdx(), mv2=dayMoneyTotal(di);
    h+="<div onclick='goDay("+di+")' class='card' style='border-left:3px solid "+(isTd?"var(--acc)":"var(--line2)")+";cursor:pointer;padding:12px 14px'>";
    h+="<div style='display:flex;justify-content:space-between;align-items:center;margin-bottom:8px'>";
    h+="<div style='font-size:14px;font-weight:700'>"+DNAMES[di]+(isTd?" <span style='font-size:10px;color:var(--acc)'>Heute</span>":"")+"</div>";
    h+="<div style='font-size:13px;color:var(--ok);font-weight:700'>€"+mv2.toLocaleString()+"</div>";
    h+="</div><div class='grid2'>";
    USERS.forEach(function(u){
      var r=userDayDone(di,u), pct2=r.total>0?Math.round((r.done/r.total)*100):0;
      h+="<div style='background:var(--bg0);border-radius:9px;padding:6px 9px'>";
      h+="<div style='font-size:10px;color:"+UCOL[u]+";font-weight:800;margin-bottom:3px'>"+u+"</div>";
      h+="<div style='font-size:13px;font-weight:800;color:"+(pct2===100?"var(--ok)":"var(--dim)")+"'>"+pct2+"%</div>";
      h+="<div class='bbg' style='margin-top:4px'><div class='bb' style='background:"+UCOL[u]+";width:"+pct2+"%'></div></div>";
      h+="</div>";
    });
    h+="</div>";
    var absNotes="";
    USERS.forEach(function(u){var av=DATA.absence[di+"_"+u];if(av)absNotes+="<div style='font-size:11px;color:var(--warn);margin-top:3px'>"+u+": "+esc(av)+"</div>";});
    if(absNotes) h+="<div style='margin-top:8px;border-top:1px solid var(--line);padding-top:8px'>"+absNotes+"</div>";
    h+="</div>";
  }
  h+="<button onclick='resetWeek()' class='smallbtn dangerbtn' style='width:100%;padding:11px'>Woche zurücksetzen</button>";
  return h;
}

function insightsTabHTML(){
  var h="";
  if(INSIGHTS.loading||!INSIGHTS.loaded){
    h+="<div class='card' style='text-align:center;color:var(--faint);font-size:13px;padding:30px 16px'>Analysiere die letzten 8 Wochen…</div>";
    return h;
  }
  var weeks=INSIGHTS.weeks;

  // Revenue per week trend
  var revs=weeks.map(function(w){var t=0;for(var i=0;i<7;i++)t+=moneyTotalOf(w.data.money||{},i);return t;});
  var maxR=Math.max.apply(null,revs.concat([1]));
  var bestIdx=revs.indexOf(Math.max.apply(null,revs));
  h+="<div class='card hot'><div class='eyebrow'>Einnahmen · letzte 8 Wochen</div>";
  h+="<div class='spark' style='height:70px'>";
  weeks.forEach(function(w,i){
    var monday=mondayFromWeekKey(w.key);
    var lbl=monday.getDate()+"."+(monday.getMonth()+1)+".";
    h+="<div class='col'>";
    h+="<div style='font-size:8px;color:"+(revs[i]>0?"var(--ok)":"var(--line2)")+"'>"+(revs[i]>=1000?Math.round(revs[i]/1000)+"k":(revs[i]||""))+"</div>";
    h+="<div class='bar' style='background:"+(i===bestIdx&&revs[i]>0?"var(--ok)":(revs[i]>0?"hsl(155 40% 35%)":"var(--line)"))+";height:"+Math.max(5,(revs[i]/maxR)*100*0.6)+"%'></div>";
    h+="<div class='lbl'>"+lbl+"</div></div>";
  });
  h+="</div>";
  if(revs[bestIdx]>0){
    var bm=mondayFromWeekKey(weeks[bestIdx].key);
    h+="<div style='font-size:11px;color:var(--dim);margin-top:10px'>💰 Beste Woche: ab "+bm.getDate()+"."+(bm.getMonth()+1)+". mit <b style='color:var(--ok)'>€"+revs[bestIdx].toLocaleString()+"</b></div>";
  }
  // Trend: last 4 vs previous 4
  var prev4=revs.slice(0,4).reduce(function(a,b){return a+b;},0);
  var last4=revs.slice(4).reduce(function(a,b){return a+b;},0);
  if(prev4>0||last4>0){
    var up=last4>=prev4;
    var diff=prev4>0?Math.round(((last4-prev4)/prev4)*100):100;
    h+="<div style='font-size:11px;color:var(--dim);margin-top:4px'>Trend letzte 4 Wochen: <b class='"+(up?"trend-up":"trend-down")+"'>"+(up?"▲":"▼")+" "+(prev4>0?Math.abs(diff)+"%":"neu")+"</b> vs. die 4 davor</div>";
  }
  h+="</div>";

  // Weekday performance
  var wd=[0,0,0,0,0,0,0], wc=[0,0,0,0,0,0,0];
  weeks.forEach(function(w){
    var chk=w.data.chk||{};
    for(var d=0;d<7;d++){
      var any=false, sum=0;
      USERS.forEach(function(u){
        var r=userDayDoneIn(chk,d,u);
        if(r.done>0)any=true;
        sum+=r.total>0?r.done/r.total:0;
      });
      if(any){wd[d]+=sum/USERS.length;wc[d]++;}
    }
  });
  var avgs=wd.map(function(v,i){return wc[i]>0?Math.round((v/wc[i])*100):null;});
  var worstIdx=-1, worstVal=101, bestWd=-1, bestVal=-1;
  avgs.forEach(function(a,i){if(a!==null){if(a<worstVal){worstVal=a;worstIdx=i;}if(a>bestVal){bestVal=a;bestWd=i;}}});
  h+="<div class='card'><div class='eyebrow'>Performance nach Wochentag</div>";
  h+="<div class='spark' style='height:64px'>";
  avgs.forEach(function(a,i){
    h+="<div class='col'>";
    h+="<div style='font-size:9px;color:"+(a===null?"var(--line2)":(i===worstIdx?"var(--bad)":"var(--dim)"))+"'>"+(a===null?"–":a+"%")+"</div>";
    h+="<div class='bar' style='background:"+(a===null?"var(--line)":(i===worstIdx?"var(--bad)":(i===bestWd?"var(--ok)":"hsl(220 20% 35%)")))+";height:"+(a===null?5:Math.max(6,a*0.55))+"%'></div>";
    h+="<div class='lbl'>"+DAYS[i]+"</div></div>";
  });
  h+="</div>";
  if(worstIdx>=0&&bestWd>=0&&worstIdx!==bestWd){
    h+="<div style='font-size:11px;color:var(--dim);margin-top:10px'>Stärkster Tag: <b style='color:var(--ok)'>"+DNAMES[bestWd]+"</b> · Schwachpunkt: <b style='color:var(--bad)'>"+DNAMES[worstIdx]+"</b> ("+worstVal+"% im Schnitt)</div>";
  }
  h+="</div>";

  // Per-user completion across 8 weeks
  h+="<div class='grid2'>";
  USERS.forEach(function(u){
    var td=0,ta=0;
    weeks.forEach(function(w){
      var chk=w.data.chk||{};
      for(var d=0;d<7;d++){var r=userDayDoneIn(chk,d,u);td+=r.done;ta+=r.total;}
    });
    var pct=ta>0?Math.round((td/ta)*100):0;
    var S=(STAMPS&&STAMPS[u])||{best:0,count:0};
    h+="<div class='card' style='border-top:3px solid "+UCOL[u]+";text-align:center'>";
    h+="<div style='font-size:12px;font-weight:800;color:"+UCOL[u]+"'>"+u+" · 8 Wochen</div>";
    h+="<div style='font-size:28px;font-weight:800;color:"+UCOL[u]+";margin-top:4px'>"+pct+"%</div>";
    h+="<div style='font-size:10px;color:var(--faint);margin-top:3px'>Best-Streak: "+(S.best||0)+" Tage</div>";
    h+="</div>";
  });
  h+="</div>";
  return h;
}

// ---------- Gestures ----------
(function(){
  var sx=0, sy=0, active=false, tileEl=null, tileDx=0;

  document.addEventListener("touchstart", function(e){
    var t=e.touches[0]; sx=t.clientX; sy=t.clientY; active=true; tileDx=0;
    tileEl = e.target.closest ? e.target.closest(".swipeable") : null;
  }, {passive:true});

  document.addEventListener("touchmove", function(e){
    if(!active) return;
    var t=e.touches[0], dx=t.clientX-sx, dy=t.clientY-sy;
    if(tileEl && dx>8 && Math.abs(dx)>Math.abs(dy)){
      tileDx=Math.min(dx,110);
      tileEl.classList.add("swiping");
      var inner=tileEl.querySelector(".inner");
      if(inner) inner.style.transform="translateX("+tileDx+"px)";
    }
  }, {passive:true});

  document.addEventListener("touchend", function(e){
    if(!active) return; active=false;
    var t=e.changedTouches[0], dx=t.clientX-sx, dy=t.clientY-sy;

    if(tileEl){
      var inner=tileEl.querySelector(".inner");
      if(inner) inner.style.transform="";
      tileEl.classList.remove("swiping");
      if(tileDx>70){
        var d=+tileEl.dataset.day, u=tileEl.dataset.user, tk=tileEl.dataset.task;
        window.toggleTask(d,u,tk);
        tileEl=null;
        return;
      }
      tileEl=null;
      if(Math.abs(dx)>10) return; // was a tile drag, don't day-swipe
    }

    // Day swipe (only in day view, not starting on inputs/textareas)
    if(view!=="day") return;
    var tgt=e.target;
    if(tgt && tgt.closest && (tgt.closest("textarea")||tgt.closest("input"))) return;
    if(Math.abs(dx)>70 && Math.abs(dx)>Math.abs(dy)*2){
      vib(8);
      if(dx<0 && cDay<6) window.goDay(cDay+1);
      else if(dx>0 && cDay>0) window.goDay(cDay-1);
    }
  }, {passive:true});

  // Long-press on revenue total -> focus first business input
  var lpTimer=null;
  document.addEventListener("touchstart", function(e){
    var tot=e.target.closest ? e.target.closest("[id^='mtotal_']") : null;
    if(!tot) return;
    lpTimer=setTimeout(function(){
      vib(20);
      var card=tot.closest(".card");
      var inp=card ? card.querySelector(".amt-input") : null;
      if(inp){ inp.focus(); inp.select(); }
    },550);
  }, {passive:true});
  document.addEventListener("touchend", function(){ if(lpTimer){clearTimeout(lpTimer);lpTimer=null;} }, {passive:true});
  document.addEventListener("touchmove", function(){ if(lpTimer){clearTimeout(lpTimer);lpTimer=null;} }, {passive:true});
})();

// ---------- Init ----------
cDay = todayIdx();
loadAll();
</script>
