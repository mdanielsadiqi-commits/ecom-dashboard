<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="theme-color" content="#08080a"/>
<title>Ecom Dashboard</title>
<style>
:root{
  --hue:8; --glow:0.12;
  --acc:hsl(var(--hue) 85% 55%);
  --acc-soft:hsl(var(--hue) 85% 55% / 0.14);
  --acc-line:hsl(var(--hue) 70% 50% / 0.5);
  --bg0:#08080a; --bg1:#101014; --bg2:#16161c;
  --line:#1e1e26; --line2:#2a2a34;
  --tx:#ececf1; --dim:#8a8a96; --faint:#4a4a55;
  --mo:#5aa4ff; --nawid:#ffb454;
  --ok:#3ddc97; --warn:#ffb454; --bad:#ff5470;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg0);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;min-height:100vh;overscroll-behavior-y:contain}
button{cursor:pointer;font-family:inherit;border:none;outline:none;color:inherit;background:none}
input,textarea,select{font-family:inherit;outline:none;color:var(--tx);background:var(--bg0)}
select{border:1px solid var(--line2);border-radius:9px;padding:7px 9px;font-size:12px}
::placeholder{color:var(--faint)}

.heatveil{position:fixed;top:0;left:0;right:0;height:190px;pointer-events:none;z-index:0;
  background:radial-gradient(120% 100% at 50% -40%, hsl(var(--hue) 90% 50% / var(--glow)), transparent 70%);
  transition:background 1.2s ease}
.wrap{position:relative;z-index:1}

.nav{background:rgba(10,10,12,.85);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top) + 12px) 16px 11px;
  display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:99;min-height:54px}
.title{font-size:16px;font-weight:800}
.nbtn{font-size:12px;padding:7px 13px;border-radius:18px;color:var(--dim);background:var(--bg2);border:1px solid var(--line2);font-weight:600}
.nbtn:active{transform:scale(.96)}

.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:100;display:flex;
  background:rgba(10,10,12,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--line);padding:6px 8px calc(env(safe-area-inset-bottom) + 6px)}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;border-radius:12px;color:var(--faint);font-size:10px;font-weight:600}
.tabbar button .ico{font-size:19px;line-height:1}
.tabbar button.on{color:var(--acc)}

.page{padding:14px 16px calc(env(safe-area-inset-bottom) + 84px);display:flex;flex-direction:column;gap:12px}
.card{background:var(--bg1);border:1px solid var(--line);border-radius:18px;padding:15px;position:relative}
.card.hot{border-color:hsl(var(--hue) 60% 40% / .5);box-shadow:0 0 24px hsl(var(--hue) 90% 50% / calc(var(--glow)*.6))}
.eyebrow{font-size:10px;letter-spacing:2.6px;text-transform:uppercase;color:var(--faint);margin-bottom:10px;font-weight:700}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bbg{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.bb{height:100%;border-radius:2px;transition:width .5s cubic-bezier(.2,.8,.2,1)}

.heatbar{display:flex;align-items:center;gap:14px;padding:13px 16px 2px}
.ring{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;position:relative;flex-shrink:0}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring .pc{font-size:13px;font-weight:800}
.heatlabel .big{font-size:15px;font-weight:800}
.heatlabel .sub{font-size:11px;color:var(--dim);margin-top:2px}

.days{display:flex;gap:5px;padding:10px 16px 0}
.day-btn{flex:1;padding:9px 2px;border-radius:12px;font-size:11px;background:var(--bg2);color:var(--faint);border:1px solid var(--line);text-align:center;font-weight:600}
.day-btn.active{background:var(--acc-soft);color:var(--acc);border-color:var(--acc-line)}
.day-btn.today:not(.active){border-color:var(--line2);color:var(--dim)}
.day-btn .dot{display:block;width:4px;height:4px;border-radius:50%;margin:3px auto 0;background:transparent}
.day-btn.perfect .dot{background:var(--ok)}

.tile{background:var(--bg0);border-radius:14px;padding:11px 12px;border-left:3px solid;position:relative;overflow:hidden;touch-action:pan-y}
.tile .inner{position:relative;transition:transform .18s ease;display:flex;align-items:center;justify-content:space-between;gap:8px}
.tile .uname{font-size:11px;font-weight:800}
.tile .chk{width:26px;height:26px;border-radius:8px;border:2px solid var(--line2);display:grid;place-items:center;font-size:13px;font-weight:800;color:#000;flex-shrink:0;transition:all .2s}
.tile.done{opacity:.72}
.tile .swipehint{position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:16px;opacity:0;transition:opacity .15s}
.tile.swiping .swipehint{opacity:.8}

.bc{width:42px;height:42px;border-radius:14px;background:var(--bg2);border:1px solid var(--line2);color:var(--tx);font-size:20px;flex-shrink:0;-webkit-user-select:none;user-select:none;display:grid;place-items:center}
.bc:active{transform:scale(.94)}
.bonus-badge{background:hsl(38 100% 60% / .15);color:var(--warn);font-size:10px;padding:2px 8px;border-radius:20px;font-weight:700}

.seg{padding:8px 15px;border-radius:20px;font-size:12px;color:var(--faint);border:1px solid var(--line);font-weight:600}
.seg.on{background:var(--acc-soft);color:var(--acc);border-color:var(--acc-line)}

.note-area{width:100%;border:1px solid var(--line2);border-radius:12px;padding:11px;font-size:13px;line-height:1.6;resize:none;min-height:72px}
.line-input{border:1px solid var(--line2);border-radius:10px;padding:9px 11px;font-size:13px;flex:1;width:100%}
.amt-input{width:88px;border:1px solid var(--line2);border-radius:9px;padding:7px 9px;font-size:14px;font-weight:700;text-align:right}
.smallbtn{font-size:11px;padding:7px 12px;border-radius:10px;background:var(--bg2);border:1px solid var(--line2);color:var(--dim);font-weight:600}
.dangerbtn{color:var(--bad);border-color:hsl(348 100% 60% / .3)}
.okbtn{color:var(--ok);border-color:hsl(155 60% 45% / .35)}

.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block;margin-right:5px;vertical-align:1px}
.sync-dot.syncing{background:var(--warn);animation:pulse 1s infinite}
.sync-dot.error{background:var(--bad)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

.pbanner{border-radius:14px;padding:11px 13px;font-size:12.5px;line-height:1.5;background:hsl(38 90% 55% / .09);border:1px solid hsl(38 90% 55% / .25);color:#ffd9a0}
.pbanner b{color:var(--warn)}
.brief{border:1px solid hsl(var(--hue) 60% 45% / .35);background:linear-gradient(160deg,hsl(var(--hue) 80% 50% / .08),transparent 60%),var(--bg1)}

.stamps{display:flex;gap:7px;margin-top:9px}
.stamp{width:37px;height:37px;border-radius:50%;border:1.5px dashed var(--line2);display:grid;place-items:center;font-size:17px;transition:all .3s}
.stamp.got{border:1.5px solid var(--ok);background:hsl(155 60% 45% / .12);animation:stampin .4s cubic-bezier(.2,1.6,.4,1)}
@keyframes stampin{0%{transform:scale(0) rotate(-30deg)}100%{transform:scale(1) rotate(0)}}
.rewardbtn{width:100%;margin-top:11px;padding:12px;border-radius:14px;font-size:13px;font-weight:800;background:linear-gradient(135deg,hsl(150 70% 45%),hsl(160 70% 38%));color:#04120b}
.rewardbtn:disabled{background:var(--bg2);color:var(--faint);font-weight:600}

.goatzone{position:fixed;inset:0;pointer-events:none;z-index:999;overflow:hidden}
.goat{position:absolute;bottom:-60px;font-size:44px;animation:goatjump 2.6s ease-in forwards}
@keyframes goatjump{
  0%{transform:translate(0,0) rotate(0)}20%{transform:translate(15vw,-45vh) rotate(-14deg)}
  40%{transform:translate(32vw,-15vh) rotate(10deg)}60%{transform:translate(52vw,-55vh) rotate(-10deg)}
  80%{transform:translate(72vw,-20vh) rotate(12deg)}100%{transform:translate(95vw,-70vh) rotate(0);opacity:0}}
.perfectflash{position:fixed;inset:0;pointer-events:none;z-index:998;background:radial-gradient(circle at 50% 60%,hsl(150 90% 50% / .22),transparent 60%);animation:pflash 1.6s ease-out forwards}
@keyframes pflash{0%{opacity:0}25%{opacity:1}100%{opacity:0}}

.spark{display:flex;align-items:flex-end;gap:4px;height:56px}
.spark .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px}
.spark .bar{width:100%;border-radius:4px 4px 0 0;min-height:3px;transition:height .5s}
.spark .lbl{font-size:9px;color:var(--faint)}
.trend-up{color:var(--ok)}.trend-down{color:var(--bad)}

.chip{font-size:10px;font-weight:700;padding:3px 9px;border-radius:12px;border:1px solid}
.chip.idee{color:var(--dim);border-color:var(--line2)}
.chip.test,.chip.bestellt{color:var(--warn);border-color:hsl(38 90% 55% / .4)}
.chip.winner,.chip.angekommen,.chip.aktiv{color:var(--ok);border-color:hsl(155 60% 45% / .4)}
.chip.verworfen{color:var(--bad);border-color:hsl(348 100% 60% / .35)}
.chip.geplant,.chip.pausiert{color:var(--dim);border-color:var(--line2)}
.chip.bewertet{color:var(--mo);border-color:hsl(215 90% 65% / .4)}

.hubrow{border-bottom:1px solid var(--line);padding:11px 0}
.hubrow:last-of-type{border-bottom:none}
.hubhead{display:flex;align-items:center;gap:9px;cursor:pointer}
.hubhead .nm{flex:1;font-size:13.5px;font-weight:700}
.hubdetail{margin-top:10px;display:flex;flex-direction:column;gap:8px}
.fieldlbl{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--faint);font-weight:700;margin-bottom:3px}
.colordot{width:20px;height:20px;border-radius:50%;flex-shrink:0;border:2px solid transparent}
.colordot.sel{border-color:#fff}

.fadeup{animation:fadeup .35s ease both}
@keyframes fadeup{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="heatveil"></div>
<div class="wrap"><div id="app" style="padding:44px 20px;text-align:center;color:var(--dim);font-size:13px">Verbinde…</div></div>
<nav class="tabbar" id="tabbar"></nav>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script>
"use strict";

/* ================= FIREBASE ================= */
firebase.initializeApp({
  apiKey:"AIzaSyBT1SPluJxSwXBSJB3_XyLZgfNgWKZgyIw",
  authDomain:"ecommonaglobal.firebaseapp.com",
  projectId:"ecommonaglobal",
  storageBucket:"ecommonaglobal.firebasestorage.app",
  messagingSenderId:"945353153605",
  appId:"1:945353153605:web:df7119e7514cdc6c7a172c"
});
const db = firebase.firestore();
try{ db.enablePersistence({synchronizeTabs:true}).catch(()=>{}); }catch(e){}

/* ================= CONSTANTS ================= */
const USERS = ["MO","Nawid"];
const UCOL = {MO:"#5aa4ff", Nawid:"#ffb454"};
const DAYS = ["Mo","Di","Mi","Do","Fr","Sa","So"];
const DNAMES = ["Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag","Sonntag"];
const MONTHNAMES = ["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];
const PALETTE = ["#5aa4ff","#ffb454","#3ddc97","#e879f9","#ff5470","#94a3b8","#f8d477","#7dd3fc"];

const DEFAULT_TASKS = [
  {id:"work", label:"Arbeitsplatz Check-in", sub:"8 Uhr morgens", color:"#5aa4ff"},
  {id:"tt1", label:"Product Research TikTok", sub:"Session 1 – 30 Min", color:"#e879f9"},
  {id:"tt2", label:"Product Research TikTok", sub:"Session 2 – 30 Min", color:"#e879f9"},
  {id:"ig1", label:"Product Research Instagram", sub:"Session 1 – 30 Min", color:"#ff5470"},
  {id:"ig2", label:"Product Research Instagram", sub:"Session 2 – 30 Min", color:"#ff5470"},
  {id:"vid", label:"Videos schneiden", sub:"3 Videos Ziel", color:"#3ddc97", goal:3},
  {id:"sleep", label:"Sleep 23 Uhr", sub:"Spätestens 23:00", color:"#94a3b8"}
];
const DEFAULT_BIZ = [
  {id:"pferd", name:"Pferdelicht", color:"#ffb454"},
  {id:"drache", name:"Drachenlampe", color:"#ff5470"},
  {id:"drop", name:"Dropshipping", color:"#5aa4ff"},
  {id:"auto", name:"Autohandel", color:"#3ddc97"}
];
const HUB_SECTIONS = [
  {key:"current",  title:"Aktuelle Businesses", empty:"Noch kein aktives Business – leg das erste an."},
  {key:"past",     title:"Frühere Businesses",  empty:"Noch nichts archiviert. Beendete Businesses landen hier – mit Learnings."},
  {key:"niches",   title:"Nischen",             empty:"Noch keine Nischen – leg die erste an."},
  {key:"products", title:"Produkte zum Testen", empty:"Pipeline leer. Nächste Research-Session füllt sie."},
  {key:"orders",   title:"Test Orders",         empty:"Keine Testbestellungen geplant."},
  {key:"goals",    title:"Allgemeine Ziele",    empty:"Keine Ziele definiert – wohin soll die Reise gehen?"}
];
const STATUS = {
  current:["aktiv","pausiert"],
  products:["idee","test","verworfen","winner"],
  orders:["geplant","bestellt","angekommen","bewertet"]
};

/* ================= STATE ================= */
const S = {
  view:"day",           // day | overview | hub | settings
  tab:"week",           // week | month | insights
  cDay:0,
  W:"",
  week:{chk:{},money:{},notes:{},checklist:{},absence:{},adhoc:{}},
  cfg:{tasks:DEFAULT_TASKS.slice(), businesses:DEFAULT_BIZ.slice()},
  stamps:null,
  hub:{current:[],past:[],niches:[],products:[],orders:[],goals:[]},
  review:null,          // current week review
  reviewArchive:{loaded:false, items:[]},
  monthDate:new Date(new Date().getFullYear(),new Date().getMonth(),1),
  monthCache:{key:null,weeks:{},loading:false,loaded:false},
  insights:{loaded:false,loading:false,weeks:[]},
  bizEdit:false,
  adhocForm:false,
  hubOpen:{},           // sectionKey -> bool
  hubEntryOpen:{},      // sec_id -> bool
  briefDismissed:{}
};

/* ================= UTILS ================= */
const $ = id => document.getElementById(id);
const esc = s => String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
const vib = ms => { if(navigator.vibrate) try{navigator.vibrate(ms||12);}catch(e){} };
const uid = p => (p||"x")+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const iso = d => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const todayIdx = () => ({1:0,2:1,3:2,4:3,5:4,6:5,0:6})[new Date().getDay()];
function weekKeyForDate(date){
  const dy=date.getDay(), di=date.getDate()-dy+(dy===0?-6:1);
  const m=new Date(date.getFullYear(),date.getMonth(),di);
  return m.getFullYear()+"_"+m.getMonth()+"_"+m.getDate();
}
const mondayFromWeekKey = wk => { const p=wk.split("_"); return new Date(+p[0],+p[1],+p[2]); };
const monthKeyFor = d => d.getFullYear()+"_"+d.getMonth();
const emptyWeek = () => ({chk:{},money:{},notes:{},checklist:{},absence:{},adhoc:{}});
const dateForDay = (dayIdx,wk) => { const m=mondayFromWeekKey(wk||S.W); return new Date(m.getFullYear(),m.getMonth(),m.getDate()+dayIdx); };

/* ================= SYNC ================= */
let saveTimer=null;
function saveWeek(){
  setSync("syncing");
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>{
    db.collection("weeks").doc(S.W).set(S.week,{merge:true})
      .then(()=>setSync("ok")).catch(()=>setSync("error"));
  },600);
}
let cfgTimer=null, hubTimer=null;
function saveCfg(){
  setSync("syncing");
  clearTimeout(cfgTimer);
  cfgTimer=setTimeout(()=>{
    db.collection("config").doc("app").set(S.cfg)
      .then(()=>setSync("ok")).catch(()=>setSync("error"));
  },500);
}
const saveStamps = () => { if(S.stamps) db.collection("config").doc("stamps").set(S.stamps).catch(()=>setSync("error")); };
function saveHub(){
  setSync("syncing");
  clearTimeout(hubTimer);
  hubTimer=setTimeout(()=>{
    db.collection("config").doc("hub").set(S.hub)
      .then(()=>setSync("ok")).catch(()=>setSync("error"));
  },500);
}
let reviewTimer=null;
function saveReview(){
  setSync("syncing");
  clearTimeout(reviewTimer);
  reviewTimer=setTimeout(()=>{
    db.collection("reviews").doc(S.W).set(S.review,{merge:true})
      .then(()=>setSync("ok")).catch(()=>setSync("error"));
  },600);
}
function setSync(state){
  document.querySelectorAll(".sync-dot").forEach(d=>{
    d.className="sync-dot"+(state==="syncing"?" syncing":state==="error"?" error":"");
  });
}

function fieldIsBeingEdited(type){
  const el=document.activeElement;
  if(!el || !el.dataset) return false;
  if(type==="config") return el.dataset.f==="taskField" || el.dataset.f==="bizName";
  if(type==="hub") return el.dataset.f==="hub";
  return false;
}

function boot(){
  S.W = weekKeyForDate(new Date());
  S.cDay = todayIdx();

  db.collection("weeks").doc(S.W).onSnapshot(snap=>{
    const d = snap.exists ? snap.data() : {};
    S.week = Object.assign(emptyWeek(), d);
    render();
  }, ()=>{ setSync("error"); render(); });

  db.collection("config").doc("app").onSnapshot(snap=>{
    if(snap.exists){
      const d=snap.data();
      if(Array.isArray(d.tasks)&&d.tasks.length) S.cfg.tasks=d.tasks;
      if(Array.isArray(d.businesses)&&d.businesses.length) S.cfg.businesses=d.businesses;
    }
    if(!fieldIsBeingEdited("config")) render();
  });

  db.collection("config").doc("stamps").onSnapshot(snap=>{
    S.stamps = snap.exists ? snap.data() : {};
    USERS.forEach(u=>{ if(!S.stamps[u]) S.stamps[u]={count:0,collected:{},streak:0,best:0,lastPerfect:""}; });
    if(!S.stamps.rewards) S.stamps.rewards=[];
    render();
  });

  db.collection("config").doc("hub").onSnapshot(snap=>{
    if(snap.exists){
      const d=snap.data();
      HUB_SECTIONS.forEach(sec=>{ S.hub[sec.key]=Array.isArray(d[sec.key])?d[sec.key]:[]; });
    }
    if(!fieldIsBeingEdited("hub")) render();
  });

  db.collection("reviews").doc(S.W).onSnapshot(snap=>{
    S.review = snap.exists ? snap.data() : {good:"",bad:"",learnings:"",focus:""};
    if(S.view==="overview"&&S.tab==="week") render();
  });
}

/* ================= DOMAIN LOGIC ================= */
const activeTasks = () => S.cfg.tasks.filter(t=>!t.paused);
const adhocFor = day => S.week.adhoc && Array.isArray(S.week.adhoc["d"+day]) ? S.week.adhoc["d"+day] : [];
function allTasksForDay(day){ return activeTasks().concat(adhocFor(day)); }

function taskDone(chk, day, user, t){
  if(t.goal>1) return (chk[day+"_"+user+"_"+t.id+"_v"]||0) >= t.goal;
  return !!chk[day+"_"+user+"_"+t.id];
}
function userDayDoneIn(weekData, day, user, tasksOverride){
  const chk=weekData.chk||{};
  const adhoc=(weekData.adhoc&&Array.isArray(weekData.adhoc["d"+day]))?weekData.adhoc["d"+day]:[];
  const tasks=(tasksOverride||activeTasks()).concat(adhoc);
  let done=0;
  tasks.forEach(t=>{ if(taskDone(chk,day,user,t)) done++; });
  return {done, total:tasks.length};
}
const userDayDone = (day,user) => userDayDoneIn(S.week, day, user);

function moneyTotalOf(moneyObj, day){
  const m=moneyObj["d"+day];
  if(typeof m==="number") return m;
  if(!m) return 0;
  let t=0; for(const k in m) t+=(+m[k]||0);
  return t;
}
const dayMoneyTotal = day => moneyTotalOf(S.week.money, day);
const weekTotal = () => { let t=0; for(let i=0;i<7;i++) t+=dayMoneyTotal(i); return t; };

function heatToday(){
  const td=todayIdx();
  let sum=0;
  USERS.forEach(u=>{ const r=userDayDone(td,u); sum+= r.total>0 ? r.done/r.total : 0; });
  return sum/USERS.length;
}
function applyHeat(){
  const h=heatToday();
  document.documentElement.style.setProperty("--hue", String(Math.round(8+137*h)));
  document.documentElement.style.setProperty("--glow", (0.12+0.5*h).toFixed(2));
}

function checkPerfect(day,user){
  if(!S.stamps) return;
  const r=userDayDone(day,user);
  if(r.total===0||r.done<r.total) return;
  const key=S.W+"_"+day, P=S.stamps[user];
  if(P.collected[key]) return;
  P.collected[key]=true;
  P.count=(P.count||0)+1;
  const d=dateForDay(day), dISO=iso(d);
  const y=new Date(d); y.setDate(y.getDate()-1);
  if(P.lastPerfect===iso(y)) P.streak=(P.streak||0)+1;
  else if(P.lastPerfect!==dISO) P.streak=1;
  P.lastPerfect=dISO;
  P.best=Math.max(P.best||0,P.streak);
  saveStamps();
  goats();
}
function goats(){
  vib([30,40,30]);
  const flash=document.createElement("div"); flash.className="perfectflash";
  const zone=document.createElement("div"); zone.className="goatzone";
  for(let i=0;i<5;i++){
    const g=document.createElement("span");
    g.className="goat"; g.textContent="🐐";
    g.style.left=(Math.random()*20-10)+"vw";
    g.style.animationDelay=(i*0.28)+"s";
    zone.appendChild(g);
  }
  document.body.append(flash,zone);
  setTimeout(()=>{zone.remove();flash.remove();},4500);
}

    const g=S.hub.goals.find(x=>x.id===d.id); if(!g) return;
    g.done=!g.done; saveHub(); vib(); render();
  },

  /* settings */
  taskAdd(){ S.cfg.tasks.push({id:uid("t"),label:"Neue Aufgabe",sub:"",color:PALETTE[S.cfg.tasks.length%PALETTE.length]}); saveCfg(); render(); },
  taskDel(d){

    S.cfg.tasks.splice(+d.idx,1); saveCfg(); render();

  taskCounter(d){
    const t=S.cfg.tasks[+d.idx]; if(!t) return;

  taskColor(d){ const t=S.cfg.tasks[+d.idx]; if(t){ t.color=d.c; saveCfg(); render(); } },
  askNotify(){
    if(!("Notification" in window)){ alert("Dein Browser unterstützt keine Benachrichtigungen."); return; }

  },
  resetDay(d){
    const day=+d.day;
    if(!confirm(DNAMES[day]+" wirklich zurücksetzen? Aufgaben, Einnahmen, Notizen, Checkliste und Tagesaufgaben werden gelöscht.")) return;
    const prefix=day+"_", chk={};
    for(const k in S.week.chk){ if(!k.startsWith(prefix)) chk[k]=S.week.chk[k]; }
    S.week.chk=chk;
    delete S.week.money["d"+day];

    delete S.week.checklist["d"+day];
    if(S.week.adhoc) delete S.week.adhoc["d"+day];

    saveWeek(); render();
  },
  resetWeek(){
    if(!confirm("GANZE Woche zurücksetzen? Alle Aufgaben, Einnahmen, Notizen, Checklisten und Tagesaufgaben dieser Woche werden unwiderruflich gelöscht.")) return;
    S.week=emptyWeek(); saveWeek(); render();
  }
};

function findTask(day,id){
  return allTasksForDay(day).find(t=>t.id===id) || S.cfg.tasks.find(t=>t.id===id) || null;

function hubNewEntry(sec){
  const base={id:uid("h")};
  switch(sec){
    case "current":  return Object.assign(base,{name:"Neues Business",note:"",status:"aktiv"});
    case "past":     return Object.assign(base,{name:"Business",note:""});
    case "niches":   return Object.assign(base,{name:"Neue Nische",keywords:"",sounds:"",merkmale:""});
    case "products": return Object.assign(base,{name:"Produkt",niche:"",link:"",note:"",status:"idee"});
    case "orders":   return Object.assign(base,{product:"Produkt",shop:"",cost:"",status:"geplant"});
    case "goals":    return Object.assign(base,{label:"Neues Ziel",target:"",progress:"",done:false});
  }
  return base;
}

/* ================= DATA LOADERS ================= */
async function loadMonth(){
  const mk=monthKeyFor(S.monthDate);
  if(S.monthCache.key===mk&&S.monthCache.loaded){ render(); return; }
  S.monthCache={key:mk,weeks:{},loading:true,loaded:false};
  render();
  const y=S.monthDate.getFullYear(), m=S.monthDate.getMonth();
  const first=new Date(y,m,1), last=new Date(y,m+1,0);
  const wk={}; const dt=new Date(first);
  while(dt<=last){ wk[weekKeyForDate(dt)]=true; dt.setDate(dt.getDate()+1); }
  const keys=Object.keys(wk), out={};
  await Promise.all(keys.map(k=>{
    if(k===S.W){ out[k]=S.week; return Promise.resolve(); }
    return db.collection("weeks").doc(k).get()
      .then(s=>{out[k]=s.exists?s.data():emptyWeek();})
      .catch(()=>{out[k]=emptyWeek();});
  }));
  if(S.monthCache.key!==mk) return;
  S.monthCache.weeks=out; S.monthCache.loading=false; S.monthCache.loaded=true;
  render();
}

async function loadInsights(){
  if(S.insights.loaded){ render(); return; }
  S.insights.loading=true; render();
  const base=mondayFromWeekKey(S.W), keys=[];
  for(let i=7;i>=0;i--){
    const d=new Date(base.getFullYear(),base.getMonth(),base.getDate()-7*i);
    keys.push(weekKeyForDate(d));
  }
  const out=[];
  await Promise.all(keys.map((k,idx)=>{
    if(k===S.W){ out[idx]={key:k,data:S.week}; return Promise.resolve(); }
    return db.collection("weeks").doc(k).get()
      .then(s=>{out[idx]={key:k,data:s.exists?s.data():emptyWeek()};})
      .catch(()=>{out[idx]={key:k,data:emptyWeek()};});
  }));
  S.insights={loaded:true,loading:false,weeks:out};
  render();
}

async function loadReviewArchive(){
  if(S.reviewArchive.loaded){ S.reviewArchive.loaded=false; S.reviewArchive.items=[]; render(); return; }
  const base=mondayFromWeekKey(S.W), keys=[];
  for(let i=1;i<=8;i++){
    const d=new Date(base.getFullYear(),base.getMonth(),base.getDate()-7*i);
    keys.push(weekKeyForDate(d));
  }
  const items=[];
  await Promise.all(keys.map(k=>db.collection("reviews").doc(k).get()
    .then(s=>{ if(s.exists) items.push({key:k,data:s.data()}); })
    .catch(()=>{})));
  items.sort((a,b)=>mondayFromWeekKey(b.key)-mondayFromWeekKey(a.key));
  S.reviewArchive={loaded:true,items:items};
  render();
}

/* ================= NOTIFICATIONS ================= */
setInterval(()=>{
  if(!("Notification" in window)||Notification.permission!=="granted") return;
  const now=new Date(), hm=now.getHours()+":"+String(now.getMinutes()).padStart(2,"0"), today=iso(now);
  const fire=(key,title,body)=>{
    const lk="notif_"+key+"_"+today;
    try{
      if(localStorage.getItem(lk)) return;
      localStorage.setItem(lk,"1");
      new Notification(title,{body});
    }catch(e){}
  };
  if(hm==="8:00"||hm==="08:00") fire("morning","Morgen-Briefing ☀️",allTasksForDay(todayIdx()).length+" Aufgaben warten heute.");
  if(hm==="22:30"){
    const td=todayIdx();
    const parts=USERS.map(u=>{const r=userDayDone(td,u);return u+" "+r.done+"/"+r.total;});
    fire("evening","Abend-Recap 🌙",parts.join(" · ")+" · €"+dayMoneyTotal(td).toLocaleString()+" heute");
  }
},30000);

/* ---------- DAY VIEW ---------- */
function vDay(){
  const isTd=S.cDay===todayIdx();
  const hour=new Date().getHours(), today=iso(new Date());
  let h="";

  h+=`<div class="nav"><div style="flex:1;text-align:center">
    <div class="title">${DNAMES[S.cDay]}${isTd?` <span style="font-size:10px;color:var(--acc)">Heute</span>`:""}</div>
    <div style="font-size:10px;color:var(--faint);margin-top:2px"><span class="sync-dot"></span>Live-Sync</div>
  </div></div>`;

  h+=`<div class="heatbar"><div id="rings" style="display:flex;gap:12px">${ringsInner()}</div>
    <div class="heatlabel" id="heatlabel" style="flex:1">${heatLabelHTML()}</div></div>`;

  h+=`<div class="days">`;
  for(let i=0;i<7;i++){
    const perfect=USERS.every(u=>{const r=userDayDone(i,u);return r.total>0&&r.done===r.total;});
    h+=`<button data-a="pickDay" data-day="${i}" class="day-btn${i===S.cDay?" active":""}${i===todayIdx()?" today":""}${perfect?" perfect":""}">${DAYS[i]}<span class="dot"></span></button>`;
  }
  h+=`</div><div class="page">`;

  // Sonntag: Rückblick-Hinweis
  if(isTd&&todayIdx()===6){
    h+=`<div class="card brief fadeup" data-a="nav" data-v="overview" data-tab="week" style="cursor:pointer">
      <div class="eyebrow">Sonntag</div>
      <div style="font-size:13px;color:var(--dim);line-height:1.6">Zeit für den gemeinsamen <b style="color:var(--tx)">Wochenrückblick</b> – tippen zum Ausfüllen →</div></div>`;
  }

  // Partner-Banner
  if(isTd) USERS.forEach(u=>{
    const note=S.week.absence[S.cDay+"_"+u];
    if(note) h+=`<div class="pbanner fadeup">📌 <b>${u}:</b> ${esc(note)}</div>`;
  });

  // Briefings
  if(isTd&&hour<12&&!S.briefDismissed["m_"+today]){
    const open=USERS.map(u=>{const r=userDayDone(S.cDay,u);return u+" "+(r.total-r.done)+" offen";}).join(" · ");
    h+=`<div class="card brief fadeup"><div class="eyebrow">Morgen-Briefing</div>
      <div style="font-size:13px;line-height:1.6;color:var(--dim)">${allTasksForDay(S.cDay).length} Aufgaben stehen an. ${open}.</div>
      <button class="smallbtn" style="margin-top:10px" data-a="brief" data-k="m">Verstanden</button></div>`;
  }
  if(isTd&&hour>=20&&!S.briefDismissed["e_"+today]){
    const parts=USERS.map(u=>{const r=userDayDone(S.cDay,u);return `<b style="color:${UCOL[u]}">${u}</b> ${r.done}/${r.total}`;}).join(" · ");
    h+=`<div class="card brief fadeup"><div class="eyebrow">Abend-Recap</div>
      <div style="font-size:13px;line-height:1.7;color:var(--dim)">${parts}<br/>€${dayMoneyTotal(S.cDay).toLocaleString()} heute eingetragen. Sleep-Deadline: 23:00.</div>
      <button class="smallbtn" style="margin-top:10px" data-a="brief" data-k="e">Passt</button></div>`;
  }

  // Wiederkehrende Aufgaben
  h+=`<div class="eyebrow" style="margin-bottom:0">Aufgaben <span style="color:var(--line2)">· swipe → erledigt</span></div>`;
  activeTasks().forEach(t=>{ h+=taskCardHTML(S.cDay,t); });

  // Ad-hoc-Aufgaben nur für diesen Tag
  const adhoc=adhocFor(S.cDay);
  if(adhoc.length){
    h+=`<div class="eyebrow" style="margin-bottom:0">Nur ${DNAMES[S.cDay]}</div>`;
    adhoc.forEach(t=>{ h+=taskCardHTML(S.cDay,t); });
  }
  if(S.adhocForm){
    h+=`<div class="card fadeup"><div class="eyebrow">Aufgabe nur für ${DNAMES[S.cDay]}</div>
      <input id="adhoc_label" class="line-input" placeholder="z.B. Niche Research" data-enter="adhocCreate" data-day="${S.cDay}"/>
      <div style="display:flex;align-items:center;gap:10px;margin-top:10px">
        <span style="font-size:12px;color:var(--dim)">Wie oft pro Person?</span>
        <input id="adhoc_goal" class="amt-input" style="width:64px" type="number" min="1" value="3"/>
      </div>
      <div style="display:flex;gap:8px;margin-top:12px">
        <button class="smallbtn okbtn" style="flex:1;padding:10px" data-a="adhocCreate" data-day="${S.cDay}">Anlegen</button>
        <button class="smallbtn" style="flex:1;padding:10px" data-a="adhocFormToggle">Abbrechen</button>
      </div>
      <div style="font-size:10px;color:var(--faint);margin-top:8px">Gilt nur für diesen Tag und zählt heute mit in den perfekten Tag. 1 = einfache Checkbox.</div></div>`;
  } else {
    h+=`<button class="smallbtn" style="width:100%;padding:11px" data-a="adhocFormToggle">+ Aufgabe nur für diesen Tag</button>`;
  }

  // Einnahmen
  h+=`<div class="card hot">${moneyCardHTML(S.cDay)}</div>`;

  // Stempelkarte
  if(S.stamps){
    h+=`<div class="card"><div class="eyebrow">Stempelkarte · 7 perfekte Tage = Belohnung</div>`;
    USERS.forEach(u=>{
      const P=S.stamps[u]||{count:0,streak:0,best:0};
      const cnt=P.count||0;
      h+=`<div style="margin-bottom:14px">
        <div style="display:flex;justify-content:space-between;align-items:baseline">
          <span style="font-size:12px;font-weight:800;color:${UCOL[u]}">${u}</span>
          <span style="font-size:10px;color:var(--faint)">Streak ${P.streak||0} · Best ${P.best||0}</span>
        </div><div class="stamps">`;
      for(let s=0;s<7;s++) h+=`<div class="stamp${s<cnt?" got":""}">${s<cnt?"🐐":""}</div>`;
      h+=`</div><button class="rewardbtn" ${cnt>=7?"":"disabled"} data-a="redeem" data-user="${u}">${cnt>=7?"Belohnung einlösen 🎉":(7-cnt)+" Stempel bis zur Belohnung"}</button></div>`;
    });
    if(S.stamps.rewards&&S.stamps.rewards.length) h+=`<div style="font-size:10px;color:var(--faint)">${S.stamps.rewards.length}× Belohnung bereits eingelöst</div>`;
    h+=`</div>`;
  }

  // Checkliste (tagesgebunden)
  h+=`<div class="card"><div class="eyebrow">Checkliste · nur ${DNAMES[S.cDay]}</div>
    <div id="cl_list_${S.cDay}">${checklistHTML(S.cDay)}</div>
    <div style="display:flex;gap:8px;margin-top:10px">
      <input id="cl_input_${S.cDay}" class="line-input" placeholder="Neuer Punkt…" data-enter="clAdd" data-day="${S.cDay}"/>
      <button class="bc" style="width:auto;padding:0 16px;font-size:16px" data-a="clAdd" data-day="${S.cDay}">+</button>
    </div></div>`;

  // Notizen (tagesgebunden)
  h+=`<div class="card"><div class="eyebrow">Notizen · nur ${DNAMES[S.cDay]}</div>
    <textarea class="note-area" placeholder="Notizen für ${DNAMES[S.cDay]}…" data-f="note" data-day="${S.cDay}">${esc(S.week.notes["shared_"+S.cDay]||"")}</textarea></div>`;

  // Info an Partner
  h+=`<div class="card"><div class="eyebrow">Info an Partner</div>`;
  USERS.forEach(u=>{
    h+=`<div style="border-left:3px solid ${UCOL[u]};padding-left:10px;margin-bottom:10px">
      <div style="font-size:11px;font-weight:800;color:${UCOL[u]};margin-bottom:6px">${u}</div>
      <textarea class="note-area" style="min-height:54px" placeholder="z.B. Schneide heute 1 Video weniger…" data-f="absence" data-day="${S.cDay}" data-user="${u}">${esc(S.week.absence[S.cDay+"_"+u]||"")}</textarea></div>`;
  });
  h+=`</div>`;

  h+=`<button class="smallbtn dangerbtn" style="width:100%;padding:11px" data-a="resetDay" data-day="${S.cDay}">Tag zurücksetzen</button>`;
  h+=`</div>`;
  return h;
}

/* ---------- OVERVIEW ---------- */
function vOverview(){
  let h=navHTML("Übersicht");
  h+=`<div class="page">`;
  h+=`<div style="display:flex;gap:8px">
    <button class="seg${S.tab==="week"?" on":""}" data-a="nav" data-v="overview" data-tab="week">Woche</button>
    <button class="seg${S.tab==="month"?" on":""}" data-a="nav" data-v="overview" data-tab="month">Monat</button>
    <button class="seg${S.tab==="insights"?" on":""}" data-a="nav" data-v="overview" data-tab="insights">Insights</button>
  </div>`;
  if(S.tab==="week") h+=weekTab();
  else if(S.tab==="month") h+=monthTab();
  else h+=insightsTab();
  h+=`</div>`;
  return h;
}

function weekTab(){
  let h="";
  const wt=weekTotal();
  h+=`<div class="card hot" style="text-align:center"><div class="eyebrow">Wocheneinnahmen</div>
    <div style="font-size:44px;font-weight:800;color:${wt>0?"var(--ok)":"var(--faint)"}">€${wt.toLocaleString()}</div>
    <div class="spark" style="margin-top:14px">`;
  let maxM=1;
  for(let i=0;i<7;i++) maxM=Math.max(maxM,dayMoneyTotal(i));
  for(let i=0;i<7;i++){
    const mv=dayMoneyTotal(i);
    h+=`<div class="col">
      <div style="font-size:9px;color:${mv>0?"var(--ok)":"var(--line2)"}">${mv>0?(mv>=1000?Math.round(mv/1000)+"k":mv):""}</div>
      <div class="bar" style="background:${mv>0?"var(--ok)":"var(--line)"};height:${Math.max(6,(mv/maxM)*50)}%"></div>
      <div class="lbl" style="color:${i===todayIdx()?"var(--acc)":"var(--faint)"}">${DAYS[i]}</div></div>`;
  }
  h+=`</div></div>`;

  const sc={};
  USERS.forEach(u=>{let td=0,ta=0;for(let d=0;d<7;d++){const r=userDayDone(d,u);td+=r.done;ta+=r.total;}sc[u]={done:td,total:ta};});
  const lead=sc[USERS[0]].done===sc[USERS[1]].done?null:(sc[USERS[0]].done>sc[USERS[1]].done?USERS[0]:USERS[1]);
  h+=`<div class="card" style="text-align:center;padding:12px"><div style="font-size:12px;color:var(--dim)">
    ${lead?`Führung diese Woche: <b style="color:${UCOL[lead]}">${lead}</b> (+${Math.abs(sc[USERS[0]].done-sc[USERS[1]].done)} Aufgaben)`:"Gleichstand diese Woche – Kopf an Kopf 🤝"}</div></div>`;

  h+=`<div class="grid2">`;
  USERS.forEach(u=>{
    const s=sc[u], pct=s.total>0?Math.round(s.done/s.total*100):0;
    h+=`<div class="card" style="border-top:3px solid ${UCOL[u]};text-align:center">
      <div style="font-size:13px;font-weight:800;color:${UCOL[u]};margin-bottom:6px">${u}</div>
      <div style="font-size:30px;font-weight:800;color:${UCOL[u]}">${pct}%</div>
      <div style="font-size:11px;color:var(--faint);margin-top:2px">${s.done}/${s.total} Aufgaben</div>
      <div class="bbg" style="margin-top:8px"><div class="bb" style="background:${UCOL[u]};width:${pct}%"></div></div></div>`;
  });
  h+=`</div>`;

  // Wochenrückblick
  h+=reviewCard(sc,wt);

  h+=`<div class="eyebrow" style="margin:4px 0 0">Tag für Tag</div>`;
  for(let d=0;d<7;d++){
    const isTd=d===todayIdx(), mv=dayMoneyTotal(d);
    h+=`<div class="card" data-a="pickDayFromOverview" data-day="${d}" style="border-left:3px solid ${isTd?"var(--acc)":"var(--line2)"};cursor:pointer;padding:12px 14px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <div style="font-size:14px;font-weight:700">${DNAMES[d]}${isTd?` <span style="font-size:10px;color:var(--acc)">Heute</span>`:""}</div>
        <div style="font-size:13px;color:var(--ok);font-weight:700">€${mv.toLocaleString()}</div></div>
      <div class="grid2">`;
    USERS.forEach(u=>{
      const r=userDayDone(d,u), pct=r.total>0?Math.round(r.done/r.total*100):0;
      h+=`<div style="background:var(--bg0);border-radius:9px;padding:6px 9px">
        <div style="font-size:10px;color:${UCOL[u]};font-weight:800;margin-bottom:3px">${u}</div>
        <div style="font-size:13px;font-weight:800;color:${pct===100?"var(--ok)":"var(--dim)"}">${pct}%</div>
        <div class="bbg" style="margin-top:4px"><div class="bb" style="background:${UCOL[u]};width:${pct}%"></div></div></div>`;
    });
    h+=`</div>`;
    let abs="";
    USERS.forEach(u=>{const av=S.week.absence[d+"_"+u];if(av)abs+=`<div style="font-size:11px;color:var(--warn);margin-top:3px">${u}: ${esc(av)}</div>`;});
    if(abs) h+=`<div style="margin-top:8px;border-top:1px solid var(--line);padding-top:8px">${abs}</div>`;
    h+=`</div>`;
  }
  h+=`<button class="smallbtn dangerbtn" style="width:100%;padding:11px" data-a="resetWeek">Woche zurücksetzen</button>`;
  return h;
}

function reviewCard(sc,wt){
  const isSunday=todayIdx()===6;
  const r=S.review||{good:"",bad:"",learnings:"",focus:""};
  const stats=USERS.map(u=>`${u} ${sc[u].done}/${sc[u].total}`).join(" · ");
  let h=`<div class="card${isSunday?" hot":""}"><div class="eyebrow">Wochenrückblick${isSunday?" · heute ausfüllen!":""}</div>
    <div style="font-size:11px;color:var(--dim);background:var(--bg0);border-radius:10px;padding:9px 11px;margin-bottom:10px">
      Zahlen-Fazit (automatisch): <b style="color:var(--ok)">€${wt.toLocaleString()}</b> · ${stats}</div>`;
  const fields=[["good","Was lief gut?"],["bad","Was lief schlecht?"],["learnings","Learnings der Woche"],["focus","Fokus für nächste Woche"]];
  fields.forEach(([f,lbl])=>{
    h+=`<div style="margin-bottom:9px"><div class="fieldlbl">${lbl}</div>
      <textarea class="note-area" style="min-height:52px" placeholder="…" data-f="review" data-f2="" data-f="${""}" data-f="${""}"></textarea></div>`;
  });
  h+=`</div>`;
  return h;
}

/* month + insights */
function monthTab(){
  let h="";
  const isCur=monthKeyFor(S.monthDate)===monthKeyFor(new Date());
  h+=`<div style="display:flex;align-items:center;justify-content:space-between">
    <button class="nbtn" data-a="shiftMonth" data-delta="-1">←</button>
    <div style="font-size:14px;font-weight:800">${MONTHNAMES[S.monthDate.getMonth()]} ${S.monthDate.getFullYear()}</div>
    <button class="nbtn" data-a="shiftMonth" data-delta="1" ${isCur?'style="opacity:.25;pointer-events:none"':""}>→</button></div>`;
  if(S.monthCache.loading||S.monthCache.key!==monthKeyFor(S.monthDate)){
    return h+`<div class="card" style="text-align:center;color:var(--faint);font-size:13px;padding:30px 16px">Lade Monatsdaten…</div>`;
  }
  const keys=Object.keys(S.monthCache.weeks).sort((a,b)=>mondayFromWeekKey(a)-mondayFromWeekKey(b));
  const ws=keys.map(k=>({key:k,s:weekSummaryInMonth(k)})).filter(x=>x.s.days>0);
  let monthTotal=0; const umt={};
  USERS.forEach(u=>umt[u]={done:0,total:0});
  ws.forEach(x=>{ monthTotal+=x.s.money; USERS.forEach(u=>{umt[u].done+=x.s.users[u].done;umt[u].total+=x.s.users[u].total;}); });

  h+=`<div class="card hot" style="text-align:center"><div class="eyebrow">Monatseinnahmen</div>
    <div style="font-size:44px;font-weight:800;color:${monthTotal>0?"var(--ok)":"var(--faint)"}">€${monthTotal.toLocaleString()}</div>
    <div style="font-size:11px;color:var(--faint);margin-top:2px">${ws.length} Wochen erfasst</div></div>`;

  h+=`<div class="grid2">`;
  USERS.forEach(u=>{
    const mt=umt[u], pct=mt.total>0?Math.round(mt.done/mt.total*100):0;
    h+=`<div class="card" style="border-top:3px solid ${UCOL[u]};text-align:center">
      <div style="font-size:13px;font-weight:800;color:${UCOL[u]};margin-bottom:6px">${u}</div>
      <div style="font-size:30px;font-weight:800;color:${UCOL[u]}">${pct}%</div>
      <div style="font-size:11px;color:var(--faint);margin-top:2px">${mt.done}/${mt.total} Aufgaben</div>
      <div class="bbg" style="margin-top:8px"><div class="bb" style="background:${UCOL[u]};width:${pct}%"></div></div></div>`;
  });
  h+=`</div><div class="eyebrow" style="margin:4px 0 0">Woche für Woche</div>`;
  if(!ws.length) h+=`<div class="card" style="text-align:center;color:var(--faint);font-size:12px">Keine Daten für diesen Monat.</div>`;
  ws.forEach((x,wi)=>{
    const s=x.s;
    const range=s.dateStart.getDate()+"."+(s.dateStart.getMonth()+1)+"."+(s.dateStart.getTime()!==s.dateEnd.getTime()?" – "+s.dateEnd.getDate()+"."+(s.dateEnd.getMonth()+1)+".":"");
    h+=`<div class="card" style="padding:13px 14px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:9px">
        <div style="font-size:13px;font-weight:700">Woche ${wi+1} <span style="color:var(--faint);font-weight:400;font-size:11px">(${range})</span></div>
        <div style="font-size:14px;color:var(--ok);font-weight:800">€${s.money.toLocaleString()}</div></div>
      <div class="grid2">`;
    USERS.forEach(u=>{
      const us=s.users[u], wp=us.total>0?Math.round(us.done/us.total*100):0;
      h+=`<div style="background:var(--bg0);border-radius:9px;padding:6px 9px">
        <div style="font-size:10px;color:${UCOL[u]};font-weight:800;margin-bottom:3px">${u}</div>
        <div style="font-size:13px;font-weight:800;color:${wp===100?"var(--ok)":"var(--dim)"}">${wp}%</div>
        <div class="bbg" style="margin-top:4px"><div class="bb" style="background:${UCOL[u]};width:${wp}%"></div></div></div>`;
    });
    h+=`</div></div>`;
  });
  return h;
}
function weekSummaryInMonth(wk){
  const monday=mondayFromWeekKey(wk);
  const wdata=S.monthCache.weeks[wk]||emptyWeek();
  const sum={money:0,users:{},dateStart:null,dateEnd:null,days:0};
  USERS.forEach(u=>sum.users[u]={done:0,total:0});
  for(let i=0;i<7;i++){
    const d=new Date(monday.getFullYear(),monday.getMonth(),monday.getDate()+i);
    if(d.getMonth()!==S.monthDate.getMonth()||d.getFullYear()!==S.monthDate.getFullYear()) continue;
    sum.days++;
    if(!sum.dateStart) sum.dateStart=d;
    sum.dateEnd=d;
    sum.money+=moneyTotalOf(wdata.money||{},i);
    USERS.forEach(u=>{
      const r=userDayDoneIn(wdata,i,u);
      sum.users[u].done+=r.done; sum.users[u].total+=r.total;
    });
  }
  return sum;
}

function insightsTab(){
  if(S.insights.loading||!S.insights.loaded){
    return `<div class="card" style="text-align:center;color:var(--faint);font-size:13px;padding:30px 16px">Analysiere die letzten 8 Wochen…</div>`;
  }
  const weeks=S.insights.weeks;
  let h="";
  const revs=weeks.map(w=>{let t=0;for(let i=0;i<7;i++)t+=moneyTotalOf(w.data.money||{},i);return t;});
  const maxR=Math.max(...revs,1), bestIdx=revs.indexOf(Math.max(...revs));

  h+=`<div class="card hot"><div class="eyebrow">Einnahmen · letzte 8 Wochen</div><div class="spark" style="height:70px">`;
  weeks.forEach((w,i)=>{
    const monday=mondayFromWeekKey(w.key);
    h+=`<div class="col">
      <div style="font-size:8px;color:${revs[i]>0?"var(--ok)":"var(--line2)"}">${revs[i]>=1000?Math.round(revs[i]/1000)+"k":(revs[i]||"")}</div>
      <div class="bar" style="background:${i===bestIdx&&revs[i]>0?"var(--ok)":(revs[i]>0?"hsl(155 40% 35%)":"var(--line)")};height:${Math.max(5,(revs[i]/maxR)*60)}%"></div>
      <div class="lbl">${monday.getDate()}.${monday.getMonth()+1}.</div></div>`;
  });
  h+=`</div>`;
  if(revs[bestIdx]>0){
    const bm=mondayFromWeekKey(weeks[bestIdx].key);
    h+=`<div style="font-size:11px;color:var(--dim);margin-top:10px">💰 Beste Woche: ab ${bm.getDate()}.${bm.getMonth()+1}. mit <b style="color:var(--ok)">€${revs[bestIdx].toLocaleString()}</b></div>`;
  }
  const prev4=revs.slice(0,4).reduce((a,b)=>a+b,0), last4=revs.slice(4).reduce((a,b)=>a+b,0);
  if(prev4>0||last4>0){
    const up=last4>=prev4, diff=prev4>0?Math.round((last4-prev4)/prev4*100):100;
    h+=`<div style="font-size:11px;color:var(--dim);margin-top:4px">Trend letzte 4 Wochen: <b class="${up?"trend-up":"trend-down"}">${up?"▲":"▼"} ${prev4>0?Math.abs(diff)+"%":"neu"}</b> vs. die 4 davor</div>`;
  }
  h+=`</div>`;

  const wd=[0,0,0,0,0,0,0], wc=[0,0,0,0,0,0,0];
  weeks.forEach(w=>{
    for(let d=0;d<7;d++){
      let any=false,sum=0;
      USERS.forEach(u=>{
        const r=userDayDoneIn(w.data,d,u);
        if(r.done>0) any=true;
        sum+=r.total>0?r.done/r.total:0;
      });
      if(any){wd[d]+=sum/USERS.length;wc[d]++;}
    }
  });
  const avgs=wd.map((v,i)=>wc[i]>0?Math.round(v/wc[i]*100):null);
  let worstIdx=-1,worstVal=101,bestWd=-1,bestVal=-1;
  avgs.forEach((a,i)=>{if(a!==null){if(a<worstVal){worstVal=a;worstIdx=i;}if(a>bestVal){bestVal=a;bestWd=i;}}});
  h+=`<div class="card"><div class="eyebrow">Performance nach Wochentag</div><div class="spark" style="height:64px">`;
  avgs.forEach((a,i)=>{
    h+=`<div class="col">
      <div style="font-size:9px;color:${a===null?"var(--line2)":(i===worstIdx?"var(--bad)":"var(--dim)")}">${a===null?"–":a+"%"}</div>
      <div class="bar" style="background:${a===null?"var(--line)":(i===worstIdx?"var(--bad)":(i===bestWd?"var(--ok)":"hsl(220 20% 35%)"))};height:${a===null?5:Math.max(6,a*0.55)}%"></div>
      <div class="lbl">${DAYS[i]}</div></div>`;
  });
  h+=`</div>`;
  if(worstIdx>=0&&bestWd>=0&&worstIdx!==bestWd){
    h+=`<div style="font-size:11px;color:var(--dim);margin-top:10px">Stärkster Tag: <b style="color:var(--ok)">${DNAMES[bestWd]}</b> · Schwachpunkt: <b style="color:var(--bad)">${DNAMES[worstIdx]}</b> (${worstVal}% im Schnitt)</div>`;
  }
  h+=`</div><div class="grid2">`;
  USERS.forEach(u=>{
    let td=0,ta=0;
    weeks.forEach(w=>{for(let d=0;d<7;d++){const r=userDayDoneIn(w.data,d,u);td+=r.done;ta+=r.total;}});
    const pct=ta>0?Math.round(td/ta*100):0;
    const P=(S.stamps&&S.stamps[u])||{best:0};
    h+=`<div class="card" style="border-top:3px solid ${UCOL[u]};text-align:center">
      <div style="font-size:12px;font-weight:800;color:${UCOL[u]}">${u} · 8 Wochen</div>
      <div style="font-size:28px;font-weight:800;color:${UCOL[u]};margin-top:4px">${pct}%</div>
      <div style="font-size:10px;color:var(--faint);margin-top:3px">Best-Streak: ${P.best||0} Tage</div></div>`;
  });
  h+=`</div>`;
  return h;
}

/* ---------- HUB ---------- */
function vHub(){
  let h=navHTML("Hub");
  h+=`<div class="page">`;
  h+=`<div style="font-size:12px;color:var(--dim);line-height:1.6;padding:0 2px">Zeitunabhängige Sammlung – Businesses, Nischen, Produkt-Pipeline, Ziele. Alles live gesynct.</div>`;
  HUB_SECTIONS.forEach(sec=>{
    const items=S.hub[sec.key]||[];
    const open=!!S.hubOpen[sec.key];
    h+=`<div class="card">
      <div style="display:flex;align-items:center;gap:10px;cursor:pointer" data-a="hubSec" data-sec="${sec.key}">
        <div class="eyebrow" style="margin:0;flex:1">${sec.title} <span style="color:var(--line2)">· ${items.length}</span></div>
        <span style="color:var(--faint);font-size:13px">${open?"▾":"▸"}</span>
      </div>`;
    if(open){
      h+=`<div style="margin-top:6px">`;
      if(!items.length) h+=`<div style="font-size:12px;color:var(--faint);padding:8px 0">${sec.empty}</div>`;
      items.forEach(e=>{ h+=hubEntryHTML(sec.key,e); });
      h+=`<button class="smallbtn" style="width:100%;margin-top:10px;padding:10px" data-a="hubAdd" data-sec="${sec.key}">+ Hinzufügen</button>`;
      h+=`</div>`;
    }
    h+=`</div>`;
  });
  h+=`</div>`;
  return h;
}

function hubEntryHTML(sec,e){
  const k=sec+"_"+e.id, open=!!S.hubEntryOpen[k];
  const title=esc(e.name||e.label||e.product||"Eintrag");
  let head=`<div class="hubhead" data-a="hubEntry" data-sec="${sec}" data-id="${e.id}">`;
  if(sec==="goals"){
    head=`<div class="hubhead">
      <div data-a="goalToggle" data-id="${e.id}" style="width:19px;height:19px;border-radius:6px;border:1.5px solid ${e.done?"var(--ok)":"var(--line2)"};background:${e.done?"var(--ok)":"transparent"};flex-shrink:0;display:grid;place-items:center;font-size:11px;color:#000;font-weight:800;cursor:pointer">${e.done?"✓":""}</div>
      <div class="nm" data-a="hubEntry" data-sec="${sec}" data-id="${e.id}" style="${e.done?"color:var(--faint);text-decoration:line-through":""}">${title}</div>`;
  } else {
    head+=`<div class="nm">${title}</div>`;
  }
  if(e.status) head+=`<span class="chip ${esc(e.status)}">${esc(e.status)}</span>`;
  head+=`<span style="color:var(--faint);font-size:12px">${open?"▾":"▸"}</span></div>`;

  let detail="";
  if(open){
    detail=`<div class="hubdetail">`;
    const fields=hubFields(sec);
    fields.forEach(f=>{
      detail+=`<div><div class="fieldlbl">${f.lbl}</div>`;
      if(f.type==="select"){
        detail+=`<select data-f="hub" data-sec="${sec}" data-id="${e.id}" data-f-key="" data-field="${f.key}" style="width:100%" data-f="hub">${
          STATUS[sec].map(s=>`<option value="${s}" ${e[f.key]===s?"selected":""}>${s}</option>`).join("")}</select>`;
      } else if(f.type==="area"){
        detail+=`<textarea class="note-area" style="min-height:48px" placeholder="${f.ph||"…"}" data-f="hub" data-sec="${sec}" data-id="${e.id}" data-field="${f.key}">${esc(e[f.key]||"")}</textarea>`;
      } else {
        detail+=`<input class="line-input" type="${f.type==="number"?"number":"text"}" ${f.type==="number"?'inputmode="decimal"':''} placeholder="${f.ph||"…"}" value="${esc(e[f.key]||"")}" data-f="hub" data-sec="${sec}" data-id="${e.id}" data-field="${f.key}"/>`;
      }
      detail+=`</div>`;
    });
    detail+=`<button class="smallbtn dangerbtn" style="align-self:flex-start" data-a="hubDel" data-sec="${sec}" data-id="${e.id}">Löschen</button></div>`;
  }
  return `<div class="hubrow">${head}${detail}</div>`;
}

function hubFields(sec){
  switch(sec){
    case "current": return [
      {key:"name",lbl:"Name"},
      {key:"note",lbl:"Notiz",type:"area"},
      {key:"status",lbl:"Status",type:"select"}];
    case "past": return [
      {key:"name",lbl:"Name"},
      {key:"note",lbl:"Warum beendet? Learnings",type:"area",ph:"Was nehmen wir mit?"}];
    case "niches": return [
      {key:"name",lbl:"Nische"},
      {key:"keywords",lbl:"Keywords",type:"area",ph:"z.B. pferde geschenk, reiterin deko…"},
      {key:"sounds",lbl:"Sounds / Audio-Referenzen",type:"area",ph:"TikTok-Sounds, die in der Nische laufen…"},
      {key:"merkmale",lbl:"Merkmale der Zielgruppe",type:"area",ph:"Wer kauft? Warum? Emotionale Trigger…"}];
    case "products": return [
      {key:"name",lbl:"Produkt"},
      {key:"niche",lbl:"Nische"},
      {key:"link",lbl:"Link / Quelle"},
      {key:"note",lbl:"Notiz",type:"area"},
      {key:"status",lbl:"Status",type:"select"}];
    case "orders": return [
      {key:"product",lbl:"Produkt"},
      {key:"shop",lbl:"Shop / Lieferant"},
      {key:"cost",lbl:"Kosten (€)",type:"number"},
      {key:"status",lbl:"Status",type:"select"}];
    case "goals": return [
      {key:"label",lbl:"Ziel"},
      {key:"target",lbl:"Zielwert (optional)",ph:"z.B. 10000"},
      {key:"progress",lbl:"Aktueller Stand (optional)",ph:"z.B. 3500"}];
  }
  return [];
}

/* ---------- SETTINGS ---------- */
function vSettings(){
  let h=navHTML("Einstellungen");
  h+=`<div class="page">`;

  const np=("Notification" in window)?Notification.permission:"unsupported";
  h+=`<div class="card"><div class="eyebrow">Erinnerungen</div>
    <div style="font-size:12px;color:var(--dim);line-height:1.6">Morgen-Briefing (8:00) und Abend-Recap (22:30) als Benachrichtigung – funktioniert, solange die App geöffnet oder im Hintergrund aktiv ist.</div>`;
  if(np==="granted") h+=`<div style="font-size:12px;color:var(--ok);margin-top:8px">✓ Aktiviert</div>`;
  else if(np==="unsupported") h+=`<div style="font-size:12px;color:var(--faint);margin-top:8px">Nicht unterstützt in diesem Browser</div>`;
  else h+=`<button class="smallbtn" style="margin-top:10px" data-a="askNotify">Benachrichtigungen erlauben</button>`;
  h+=`</div>`;

  h+=`<div class="card"><div class="eyebrow">Wiederkehrende Aufgaben</div>`;
  S.cfg.tasks.forEach((t,idx)=>{
    h+=`<div style="padding:12px 0;border-bottom:1px solid var(--line)">
      <input class="line-input" value="${esc(t.label)}" data-f="taskField" data-idx="${idx}" data-f-key="" data-field="label" data-f="taskField"/>
      <input class="line-input" style="font-size:11px;color:var(--dim);margin-top:8px" placeholder="Untertitel (optional)" value="${esc(t.sub||"")}" data-f="taskField" data-idx="${idx}" data-field="sub"/>
      <div style="display:flex;align-items:center;gap:6px;margin-top:10px;flex-wrap:wrap">`;
    PALETTE.forEach(c=>{
      h+=`<button class="colordot${t.color===c?" sel":""}" style="background:${c}" data-a="taskColor" data-idx="${idx}" data-c="${c}"></button>`;
    });
    h+=`</div><div style="display:flex;gap:8px;margin-top:10px;align-items:center;flex-wrap:wrap">
      <button class="smallbtn" data-a="taskCounter" data-idx="${idx}">${t.goal>1?"Zähler: an":"Zähler: aus"}</button>`;
    if(t.goal>1) h+=`<span style="font-size:11px;color:var(--dim)">Ziel:</span><input class="amt-input" style="width:56px" type="number" min="2" value="${t.goal}" data-f="taskField" data-idx="${idx}" data-field="goal"/>`;
    h+=`<button class="smallbtn" data-a="taskPause" data-idx="${idx}">${t.paused?"▶ Fortsetzen":"⏸ Pausieren"}</button>
      <button class="smallbtn dangerbtn" data-a="taskDel" data-idx="${idx}">Löschen</button></div>`;
    if(t.paused) h+=`<div style="font-size:10px;color:var(--warn);margin-top:6px">Pausiert – zählt nicht in Statistiken</div>`;
    h+=`</div>`;
  });
  h+=`<button class="smallbtn" style="margin-top:12px;width:100%;padding:11px" data-a="taskAdd">+ Aufgabe hinzufügen</button></div>`;

  h+=`<div class="card"><div class="eyebrow">Businesses</div>
    <div style="font-size:11px;color:var(--faint);margin-bottom:6px">Auch direkt in der Tagesansicht über „Bearbeiten" editierbar.</div>`;
  S.cfg.businesses.forEach((b,idx)=>{
    h+=`<div style="padding:10px 0;border-bottom:1px solid var(--line)">
      <div style="display:flex;gap:8px;align-items:center">
        <span style="width:11px;height:11px;border-radius:50%;background:${b.color};flex-shrink:0"></span>
        <input class="line-input" value="${esc(b.name)}" data-f="bizName" data-idx="${idx}"/>
        <button class="smallbtn dangerbtn" data-a="bizDel" data-idx="${idx}">✕</button></div>
      <div style="display:flex;gap:6px;margin-top:8px">`;
    PALETTE.forEach(c=>{
      h+=`<button class="colordot${b.color===c?" sel":""}" style="background:${c};width:17px;height:17px" data-a="bizColor" data-idx="${idx}" data-c="${c}"></button>`;
    });
    h+=`</div></div>`;
  });
  h+=`<button class="smallbtn" style="margin-top:12px;width:100%;padding:11px" data-a="bizAdd">+ Business hinzufügen</button></div>`;

  h+=`<div class="card"><div class="eyebrow" style="color:var(--bad)">Gefahrenzone</div>
    <div style="display:flex;gap:8px">
      <button class="smallbtn dangerbtn" style="flex:1;padding:11px" data-a="resetDay" data-day="${S.cDay}">Tag zurücksetzen</button>
      <button class="smallbtn dangerbtn" style="flex:1;padding:11px" data-a="resetWeek">Woche zurücksetzen</button>
    </div></div>`;

  h+=`<div style="text-align:center;font-size:10px;color:var(--faint);padding:6px">Ecom Dashboard · Glut-Edition 2.0 🐐</div>`;
  h+=`</div>`;
  return h;
}

/* ================= GESTURES ================= */
(function(){
  let sx=0,sy=0,active=false,tileEl=null,tileDx=0;
  document.addEventListener("touchstart",e=>{
    const t=e.touches[0];
    sx=t.clientX; sy=t.clientY; active=true; tileDx=0;
    tileEl=e.target.closest?e.target.closest(".swipeable"):null;
  },{passive:true});
  document.addEventListener("touchmove",e=>{
    if(!active) return;
    const t=e.touches[0], dx=t.clientX-sx, dy=t.clientY-sy;
    if(tileEl&&dx>8&&Math.abs(dx)>Math.abs(dy)){
      tileDx=Math.min(dx,110);
      tileEl.classList.add("swiping");
      const inner=tileEl.querySelector(".inner");
      if(inner) inner.style.transform=`translateX(${tileDx}px)`;
    }
  },{passive:true});
  document.addEventListener("touchend",e=>{
    if(!active) return; active=false;
    const t=e.changedTouches[0], dx=t.clientX-sx, dy=t.clientY-sy;
    if(tileEl){
      const inner=tileEl.querySelector(".inner");
      if(inner) inner.style.transform="";
      tileEl.classList.remove("swiping");
      if(tileDx>70){
        const d=tileEl.dataset;
        A.toggle({day:d.day,user:d.user,task:d.task});
        tileEl=null; return;
      }
      tileEl=null;
      if(Math.abs(dx)>10) return;
    }
    if(S.view!=="day") return;
    const tgt=e.target;
    if(tgt&&tgt.closest&&(tgt.closest("textarea")||tgt.closest("input")||tgt.closest("select"))) return;
    if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*2){
      vib(8);
      if(dx<0&&S.cDay<6) A.pickDay({day:S.cDay+1});
      else if(dx>0&&S.cDay>0) A.pickDay({day:S.cDay-1});
    }
  },{passive:true});
})();

/* ================= INIT ================= */
boot();
</script>
